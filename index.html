<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متابعة افتقاد الخدام</title>
  <style>
    :root {
      --primary-color: #701c1c; /* نبيتي كنسي */
      --secondary-color: #b38728; /* ذهبي عتيق */
      --accent-color: #1b3b6f; /* أزرق ملكي */
      --bg-color: #fcfbf7; /* خلفية بيج دافئة */
      --card-bg: #ffffff;
      --border-color: #e2d8c3;
    }

    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      padding: 15px; 
      background-color: var(--bg-color); 
      color: #2c2c2c; 
      max-width: 650px;
      margin: 0 auto;
    }

    .header-container {
      text-align: center;
      background: linear-gradient(135deg, #581414, var(--primary-color));
      color: #fff;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      border-bottom: 4px solid var(--secondary-color);
      margin-bottom: 20px;
    }

    .header-container h2 {
      margin: 5px 0 0 0;
      font-size: 20px;
      font-weight: bold;
      color: #f8f1e5;
    }

    .header-icon {
      font-size: 24px;
      color: var(--secondary-color);
    }

    .tab { 
      display: flex; 
      justify-content: space-around; 
      margin-bottom: 20px; 
      background: #eee3d3;
      border-radius: 8px;
      padding: 4px;
      gap: 4px;
    }

    .tab button { 
      flex: 1;
      background: none; 
      border: none; 
      padding: 10px 5px; 
      cursor: pointer; 
      font-weight: bold; 
      color: #555; 
      border-radius: 6px;
      transition: all 0.3s ease;
      font-size: 13px;
    }

    .tab button.active { 
      background-color: var(--primary-color); 
      color: #fff; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .form-group { margin-bottom: 12px; position: relative; }
    label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #444; }
    
    input[type="text"], input[type="date"], select { 
      width: 100%; 
      padding: 9px; 
      border: 1px solid var(--border-color); 
      border-radius: 6px; 
      box-sizing: border-box; 
      font-size: 14px;
      background-color: #fafafa;
    }

    input[type="text"]:focus, select:focus, input[type="date"]:focus {
      outline: none;
      border-color: var(--secondary-color);
      box-shadow: 0 0 5px rgba(179, 135, 40, 0.4);
    }

    .suggestions { 
      position: absolute; 
      top: 100%; 
      left: 0; 
      right: 0; 
      background: white; 
      border: 1px solid var(--secondary-color); 
      border-top: none; 
      z-index: 1000; 
      max-height: 160px; 
      overflow-y: auto; 
      border-radius: 0 0 6px 6px; 
      box-shadow: 0 4px 8px rgba(0,0,0,0.15); 
    }

    .suggestion-item { 
      padding: 10px; 
      cursor: pointer; 
      font-size: 13px; 
      border-bottom: 1px solid #f0f0f0; 
    }

    .suggestion-item:hover { background-color: #fdf8ed; color: var(--primary-color); }

    .checkbox-group { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      margin-bottom: 10px; 
      background: #fdfbf7; 
      padding: 8px 12px; 
      border-radius: 6px; 
      border: 1px solid var(--border-color); 
    }

    .checkbox-group label { margin: 0; font-size: 13px; font-weight: 600; color: #333; }

    .bible-options { 
      background: #fdfbf7; 
      padding: 10px 12px; 
      border-radius: 6px; 
      border: 1px solid var(--border-color); 
      margin-bottom: 12px; 
    }

    .bible-options-title { font-size: 13px; font-weight: bold; margin-bottom: 8px; color: var(--primary-color); }
    .bible-checkboxes { display: flex; gap: 20px; font-size: 13px; }
    .bible-checkboxes label { font-weight: normal; cursor: pointer; display: flex; align-items: center; gap: 5px; }

    button.btn-submit { 
      width: 100%; 
      padding: 11px; 
      background: linear-gradient(135deg, var(--primary-color), #8a2323); 
      color: white; 
      border: none; 
      border-radius: 6px; 
      font-size: 15px; 
      font-weight: bold; 
      cursor: pointer; 
      margin-top: 10px; 
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      transition: background 0.3s;
    }

    button.btn-submit:hover { 
      background: linear-gradient(135deg, #581414, var(--primary-color)); 
    }

    button.btn-print {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #28a745, #1e7e34);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      display: none; /* يظهر فقط عند وجود نتائج */
    }

    #status { margin-top: 12px; text-align: center; font-weight: bold; font-size: 13px; color: var(--primary-color); }

    .record-card { 
      background: white; 
      border-right: 4px solid var(--secondary-color); 
      border-top: 1px solid var(--border-color);
      border-left: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 12px; 
      margin-bottom: 10px; 
      border-radius: 4px; 
      font-size: 13px; 
      line-height: 1.6;
    }

    /* جدول التقرير اليومي الشامل */
    .report-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 12px;
    }

    .report-table th, .report-table td {
      border: 1px solid var(--border-color);
      padding: 8px 4px;
      text-align: center;
    }

    .report-table th {
      background-color: var(--primary-color);
      color: white;
      font-weight: bold;
    }

    .report-table tr:nth-child(even) {
      background-color: #fdfbf7;
    }

    /* تنسيق خاص للطباعة */
    @media print {
      body { background: #fff; max-width: 100%; padding: 0; }
      .tab, .btn-submit, .btn-print, .form-group, .suggestions { display: none !important; }
      .card { border: none; box-shadow: none; padding: 0; }
      .record-card { page-break-inside: avoid; border: 1px solid #ccc; border-right: 4px solid #701c1c; }
      .header-container { background: none; color: #000; border-bottom: 2px solid #701c1c; box-shadow: none; }
      .header-container h2 { color: #000; }
      .header-icon { color: #000; }
      .report-table th { background-color: #701c1c !important; color: #fff !important; -webkit-print-color-adjust: exact; }
    }
  </style>
</head>
<body>

  <div class="header-container">
    <div class="header-icon">☦️</div>
    <h2>استمارة متابعة الخدام</h2>
  </div>

  <div class="tab">
    <button class="active" onclick="openTab('add')">تسجيل حضور</button>
    <button onclick="openTab('search')">عرض سجل خادم</button>
    <button onclick="openTab('report')">تقرير كل الخدام</button>
  </div>

  <!-- تبويب تسجيل البيانات -->
  <div id="add" class="tab-content active">
    <div class="card">
      <div class="form-group">
        <label>🔍 بحث بالاسم أو الكود:</label>
        <input type="text" id="searchInput" oninput="onSearchInput(this.value)" placeholder="اكتب الاسم أو الكود..." autocomplete="off">
        <div id="suggestionsBox" class="suggestions" style="display: none;"></div>
      </div>

      <div class="form-group">
        <label>كود الخادم:</label>
        <input type="text" id="servantCode" readonly placeholder="سيظهر تلقائياً" style="background-color: #f0f0f0;">
      </div>

      <div class="form-group">
        <label>اسم الخادم:</label>
        <input type="text" id="servantName" readonly placeholder="سيظهر تلقائياً" style="background-color: #f0f0f0;">
      </div>

      <div class="form-group">
        <label>التاريخ:</label>
        <input type="date" id="entryDate">
      </div>

      <hr style="border: 0; border-top: 1px dashed var(--border-color); margin: 15px 0;">

      <div class="checkbox-group">
        <label>حضور قداس:</label>
        <select id="qaddas"><option value="نعم">نعم</option><option value="لا">لا</option></select>
      </div>

      <div class="checkbox-group">
        <label>حضور مدارس أحد:</label>
        <select id="sundaySchool"><option value="نعم">نعم</option><option value="لا">لا</option></select>
      </div>

      <div class="checkbox-group">
        <label>حضور إجتماع خدمة:</label>
        <select id="meeting"><option value="نعم">نعم</option><option value="لا">لا</option></select>
      </div>

      <div class="checkbox-group">
        <label>تحضير الدرس:</label>
        <select id="preparation"><option value="نعم">نعم</option><option value="لا">لا</option></select>
      </div>

      <div class="bible-options">
        <div class="bible-options-title">قراءة الكتاب المقدس:</div>
        <div class="bible-checkboxes">
          <label><input type="checkbox" id="bibleOld" value="عهد قديم"> عهد قديم</label>
          <label><input type="checkbox" id="bibleNew" value="عهد جديد"> عهد جديد</label>
        </div>
      </div>

      <button class="btn-submit" onclick="submitForm()">حفظ البيانات</button>
      <div id="status"></div>
    </div>
  </div>

  <!-- تبويب البحث لسجل خادم معين -->
  <div id="search" class="tab-content">
    <div class="card">
      <div class="form-group">
        <label>🔍 ابحث لمشاهدة السجل الكامل:</label>
        <input type="text" id="searchRecordInput" oninput="onSearchRecordInput(this.value)" placeholder="اكتب الاسم أو الكود..." autocomplete="off">
        <div id="searchRecordSuggestions" class="suggestions" style="display: none;"></div>
      </div>
      
      <input type="hidden" id="selectedSearchCode">
      <input type="hidden" id="selectedSearchName">
      
      <button class="btn-submit" style="background: linear-gradient(135deg, var(--accent-color), #2d5592);" onclick="searchRecords()">عرض السجل</button>
      
      <div id="searchResults" style="margin-top: 15px;"></div>

      <button id="btnPrint" class="btn-print" onclick="window.print()">🖨️ طباعة التقرير / حفظ PDF</button>
    </div>
  </div>

  <!-- تبويب تقرير كل الخدام بالتاريخ -->
  <div id="report" class="tab-content">
    <div class="card">
      <div class="form-group">
        <label>📅 اختر التاريخ لعرض التقرير:</label>
        <input type="date" id="reportDate">
      </div>

      <button class="btn-submit" style="background: linear-gradient(135deg, var(--secondary-color), #8c681b);" onclick="getDailyReport()">عرض تقرير كل الخدام</button>

      <div id="reportResults" style="margin-top: 15px;"></div>

      <button id="btnReportPrint" class="btn-print" onclick="window.print()">🖨️ طباعة التقرير / حفظ PDF</button>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyPh2KCwGD1tMtoCJWyqxfULCErM6nazkqsky8q75s4vnOSHjgfajVdfL_sz4He2oVq_g/exec";

    // ضبط تاريخ اليوم تلقائياً
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('entryDate').value = today;
    document.getElementById('reportDate').value = today;

    function openTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab button').forEach(el => el.classList.remove('active'));
      document.getElementById(tabName).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    function fetchJSONP(url, callbackName) {
      return new Promise((resolve) => {
        const script = document.createElement('script');
        window[callbackName] = function(data) {
          resolve(data);
          document.body.removeChild(script);
          delete window[callbackName];
        };
        script.src = `${url}&callback=${callbackName}`;
        document.body.appendChild(script);
      });
    }

    function onSearchInput(val) {
      var box = document.getElementById('suggestionsBox');
      if (!val.trim()) {
        box.style.display = 'none';
        return;
      }

      var url = `${SCRIPT_URL}?action=searchServants&query=${encodeURIComponent(val)}`;
      fetchJSONP(url, 'handleServantsList').then(list => {
        if (!list || list.length === 0) {
          box.style.display = 'none';
          return;
        }
        var html = '';
        list.forEach(function(item) {
          html += `<div class="suggestion-item" onclick="selectServant('${item.code}', '${item.name}')">
            <b>${item.name}</b> (${item.code})
          </div>`;
        });
        box.innerHTML = html;
        box.style.display = 'block';
      });
    }

    function selectServant(code, name) {
      document.getElementById('servantCode').value = code;
      document.getElementById('servantName').value = name;
      document.getElementById('searchInput').value = name;
      document.getElementById('suggestionsBox').style.display = 'none';
    }

    function onSearchRecordInput(val) {
      var box = document.getElementById('searchRecordSuggestions');
      if (!val.trim()) {
        box.style.display = 'none';
        return;
      }

      var url = `${SCRIPT_URL}?action=searchServants&query=${encodeURIComponent(val)}`;
      fetchJSONP(url, 'handleRecordServants').then(list => {
        if (!list || list.length === 0) {
          box.style.display = 'none';
          return;
        }
        var html = '';
        list.forEach(function(item) {
          html += `<div class="suggestion-item" onclick="selectRecordServant('${item.code}', '${item.name}')">
            <b>${item.name}</b> (${item.code})
          </div>`;
        });
        box.innerHTML = html;
        box.style.display = 'block';
      });
    }

    function selectRecordServant(code, name) {
      document.getElementById('selectedSearchCode').value = code;
      document.getElementById('selectedSearchName').value = name;
      document.getElementById('searchRecordInput').value = `${name} (${code})`;
      document.getElementById('searchRecordSuggestions').style.display = 'none';
    }

    function submitForm() {
      var code = document.getElementById('servantCode').value;
      var name = document.getElementById('servantName').value;
      if (!code || !name) {
        alert("يرجى اختيار خادم أولاً من القائمة المنسدلة");
        return;
      }

      var bibleSelected = [];
      if (document.getElementById('bibleOld').checked) bibleSelected.push("عهد قديم");
      if (document.getElementById('bibleNew').checked) bibleSelected.push("عهد جديد");
      var bibleValue = bibleSelected.length > 0 ? bibleSelected.join(" + ") : "لا يوجد";

      document.getElementById('status').innerText = "جاري حفظ البيانات...";

      var params = `action=saveData&code=${encodeURIComponent(code)}&name=${encodeURIComponent(name)}` +
                   `&date=${encodeURIComponent(document.getElementById('entryDate').value)}` +
                   `&qaddas=${encodeURIComponent(document.getElementById('qaddas').value)}` +
                   `&sundaySchool=${encodeURIComponent(document.getElementById('sundaySchool').value)}` +
                   `&meeting=${encodeURIComponent(document.getElementById('meeting').value)}` +
                   `&preparation=${encodeURIComponent(document.getElementById('preparation').value)}` +
                   `&bible=${encodeURIComponent(bibleValue)}`;

      fetchJSONP(`${SCRIPT_URL}?${params}`, 'handleSaveResponse').then(res => {
        document.getElementById('status').innerText = "✨ تم حفظ البيانات بنجاح!";
        document.getElementById('servantCode').value = '';
        document.getElementById('servantName').value = '';
        document.getElementById('searchInput').value = '';
        document.getElementById('bibleOld').checked = false;
        document.getElementById('bibleNew').checked = false;
      });
    }

    function searchRecords() {
      var code = document.getElementById('selectedSearchCode').value;
      var name = document.getElementById('selectedSearchName').value;
      if (!code) {
        alert("يرجى اختيار خادم من البحث أولاً");
        return;
      }

      var resultsDiv = document.getElementById('searchResults');
      var printBtn = document.getElementById('btnPrint');
      resultsDiv.innerHTML = "جاري البحث عن السجلات...";
      printBtn.style.display = 'none';

      var url = `${SCRIPT_URL}?action=searchServantData&code=${encodeURIComponent(code)}`;
      fetchJSONP(url, 'handleRecordsData').then(records => {
        if(!records || records.length === 0) {
          resultsDiv.innerHTML = "<p style='text-align:center; color:#777;'>لا توجد سجلات سابقة لهذا الخادم.</p>";
          return;
        }
        
        var html = `<h4 style="margin: 0 0 10px 0; color: var(--primary-color);">سجل الخادم: ${name} (${code})</h4>`;
        records.forEach(function(rec) {
          html += `<div class="record-card">
            <b>📅 التاريخ:</b> ${rec.date}<br>
            <b>✝️ قداس:</b> ${rec.qaddas} | <b>🏫 مدارس أحد:</b> ${rec.sundaySchool}<br>
            <b>🤝 اجتماع خدمة:</b> ${rec.meeting}<br>
            <b>📝 تحضير:</b> ${rec.preparation} | <b>📖 كتاب مقدس:</b> ${rec.bible}
          </div>`;
        });
        resultsDiv.innerHTML = html;
        printBtn.style.display = 'block';
      });
    }

    // دالة جلب تقرير كل الخدام بتاريخ محدد
    function getDailyReport() {
      var dateVal = document.getElementById('reportDate').value;
      if (!dateVal) {
        alert("يرجى اختيار التاريخ أولاً");
        return;
      }

      var resultsDiv = document.getElementById('reportResults');
      var printBtn = document.getElementById('btnReportPrint');
      resultsDiv.innerHTML = "جاري تحميل تقرير اليوم...";
      printBtn.style.display = 'none';

      var url = `${SCRIPT_URL}?action=getAllServantsDataByDate&date=${encodeURIComponent(dateVal)}`;
      fetchJSONP(url, 'handleDailyReportData').then(records => {
        if(!records || records.length === 0) {
          resultsDiv.innerHTML = `<p style='text-align:center; color:#777;'>لا توجد سجلات مسجلة لتاريخ: ${dateVal}</p>`;
          return;
        }

        var html = `<h4 style="margin: 0 0 10px 0; color: var(--primary-color); text-align: center;">📊 تقرير افتقاد الخدام ليوم: ${dateVal}</h4>`;
        html += `<table class="report-table">
          <thead>
            <tr>
              <th>الخادم</th>
              <th>قداس</th>
              <th>مدارس أحد</th>
              <th>اجتماع</th>
              <th>تحضير</th>
              <th>الكتاب المقدس</th>
            </tr>
          </thead>
          <tbody>`;

        records.forEach(function(rec) {
          html += `<tr>
            <td><b>${rec.name}</b><br><small>(${rec.code})</small></td>
            <td>${rec.qaddas}</td>
            <td>${rec.sundaySchool}</td>
            <td>${rec.meeting}</td>
            <td>${rec.preparation}</td>
            <td>${rec.bible}</td>
          </tr>`;
        });

        html += `</tbody></table>`;
        resultsDiv.innerHTML = html;
        printBtn.style.display = 'block';
      });
    }
  </script>
</body>
</html>
