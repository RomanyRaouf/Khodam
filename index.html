<!-- قسم التقارير والتصدير -->
<section id="reportsSection" class="card shadow-sm mb-4">
  <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
    <h5 class="mb-0"><i class="bi bi-file-earmark-bar-graph me-2"></i>تقارير الحضور والتصدير</h5>
    <button class="btn btn-light btn-sm" onclick="exportToExcel()">
      <i class="bi bi-file-earmark-excel text-success me-1"></i>تصدير إلى Excel
    </button>
  </div>
  <div class="card-body">
    <!-- شريط تصفية وتحديد التاريخ/الفترة -->
    <div class="row g-3 mb-4 align-items-end">
      <div class="col-md-4">
        <label for="reportDate" class="form-label fw-bold">اختر التاريخ:</label>
        <input type="date" id="reportDate" class="form-control" onchange="generateReports()">
      </div>
      <div class="col-md-4">
        <label for="reportStage" class="form-label fw-bold">المرحلة / الصف:</label>
        <select id="reportStage" class="form-select" onchange="generateReports()">
          <option value="all">كل المراحل</option>
          <option value="primary">ابتدائي</option>
          <option value="prep">إعدادي</option>
          <option value="sec">ثانوي</option>
        </select>
      </div>
      <div class="col-md-4 text-end">
        <button class="btn btn-outline-primary w-100" onclick="generateReports()">
          <i class="bi bi-arrow-clockwise me-1"></i>تحديث التقارير
        </button>
      </div>
    </div>

    <!-- شبكة التقارير (4 أقسام) -->
    <div class="row g-3">
      
      <!-- 1. حضور القداس -->
      <div class="col-md-6 col-lg-3">
        <div class="card h-100 border-success">
          <div class="card-header bg-success text-white fw-bold d-flex justify-content-between align-items-center">
            <span><i class="bi bi-church me-1"></i>حضور القداس</span>
            <span id="massCount" class="badge bg-white text-success fs-6">0</span>
          </div>
          <div class="card-body p-2 style-scroll" style="max-height: 300px; overflow-y: auto;">
            <ul id="massList" class="list-group list-group-flush">
              <!-- يتم ملؤه ديناميكياً -->
            </ul>
          </div>
        </div>
      </div>

      <!-- 2. حضور مدارس الأحد -->
      <div class="col-md-6 col-lg-3">
        <div class="card h-100 border-info">
          <div class="card-header bg-info text-white fw-bold d-flex justify-content-between align-items-center">
            <span><i class="bi bi-book me-1"></i>مدارس الأحد</span>
            <span id="sundaySchoolCount" class="badge bg-white text-info fs-6">0</span>
          </div>
          <div class="card-body p-2 style-scroll" style="max-height: 300px; overflow-y: auto;">
            <ul id="sundaySchoolList" class="list-group list-group-flush">
              <!-- يتم ملؤه ديناميكياً -->
            </ul>
          </div>
        </div>
      </div>

      <!-- 3. حضور اجتماع الخدمة -->
      <div class="col-md-6 col-lg-3">
        <div class="card h-100 border-warning">
          <div class="card-header bg-warning text-dark fw-bold d-flex justify-content-between align-items-center">
            <span><i class="bi bi-people me-1"></i>اجتماع الخدمة</span>
            <span id="serviceMeetingCount" class="badge bg-dark text-white fs-6">0</span>
          </div>
          <div class="card-body p-2 style-scroll" style="max-height: 300px; overflow-y: auto;">
            <ul id="serviceMeetingList" class="list-group list-group-flush">
              <!-- يتم ملؤه ديناميكياً -->
            </ul>
          </div>
        </div>
      </div>

      <!-- 4. الغياب الكلي -->
      <div class="col-md-6 col-lg-3">
        <div class="card h-100 border-danger">
          <div class="card-header bg-danger text-white fw-bold d-flex justify-content-between align-items-center">
            <span><i class="bi bi-person-x me-1"></i>الغياب الكلي</span>
            <span id="absentCount" class="badge bg-white text-danger fs-6">0</span>
          </div>
          <div class="card-body p-2 style-scroll" style="max-height: 300px; overflow-y: auto;">
            <ul id="absentList" class="list-group list-group-flush">
              <!-- يتم ملؤه ديناميكياً -->
            </ul>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
