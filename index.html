<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام تسجيل حضور الخدام</title>
  <style>
    :root {
      --primary-color: #007bff;
      --success-color: #28a745;
      --danger-color: #dc3545;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #333333;
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: var(--primary-color);
      margin-top: 0;
      margin-bottom: 20px;
    }

    .status-bar {
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 15px;
      font-size: 0.9em;
    }

    .status-loading {
      background-color: #fff3cd;
      color: #856404;
    }

    .status-success {
      background-color: #d4edda;
      color: #155724;
    }

    .status-error {
      background-color: #f8d7da;
      color: #721c24;
    }

    .btn-add-servant {
      width: 100%;
      background-color: var(--success-color);
      color: #fff;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 20px;
      font-size: 1em;
    }

    .btn-add-servant:hover {
      opacity: 0.9;
    }

    .form-group {
      margin-bottom: 15px;
      position: relative;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1em;
    }

    /* قائمة الاقتراحات التلقائية */
    .suggestions-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid #ccc;
      border-top: none;
      border-radius: 0 0 6px 6px;
      max-height: 150px;
      overflow-y: auto;
      z-index: 10;
      display: none;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .suggestion-item {
      padding: 10px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
    }

    .suggestion-item:hover {
      background-color: #f1f1f1;
    }

    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #f1f3f5;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 15px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .checkbox-item input {
      width: 18px;
      height: 18px;
    }

    .btn-submit {
      width: 100%;
      background-color: var(--primary-color);
      color: #fff;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-submit:disabled {
      background-color: #aaa;
    }

    /* Modal - النافذة المنبثقة */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-content {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .modal-actions button {
      flex: 1;
      padding: 10px;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-save {
      background: var(--success-color);
      color: white;
    }

    .btn-cancel {
      background: #6c757d;
      color: white;
    }

    .msg-box {
      margin-top: 10px;
      padding: 8px;
      border-radius: 4px;
      text-align: center;
      font-size: 0.9em;
    }

    .msg-error {
      background: #f8d7da;
      color: #721c24;
    }

    .msg-success {
      background: #d4edda;
      color: #155724;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>تسجيل حضور الخدام</h2>

    <!-- شريط حالة التحميل -->
    <div id="statusLoading" class="status-bar status-loading">⏳ جاري تحميل قائمة الخدام...</div>

    <!-- زر إضافة خادم جديد -->
    <button type="button" class="btn-add-servant" onclick="openAddServantModal()">➕ إضافة خادم جديد</button>

    <!-- نموذج تسجيل الحضور -->
    <form id="attendanceForm">
      <div class="form-group">
        <label>التاريخ:</label>
        <input type="date" id="attendanceDate" required>
      </div>

      <div class="form-group">
        <label>كود الخادم:</label>
        <input type="text" id="servantCode" placeholder="أدخل الكود أو ابحث بالاسم" autocomplete="off" required>
        <div id="suggestionsList" class="suggestions-list"></div>
      </div>

      <div class="form-group">
        <label>اسم الخادم:</label>
        <input type="text" id="servantName" readonly placeholder="يظهر تلقائياً...">
      </div>

      <div class="form-group">
        <label>الخدمة:</label>
        <input type="text" id="serviceType" readonly placeholder="تظهر تلقائياً...">
      </div>

      <div class="checkbox-group">
        <label class="checkbox-item">
          <input type="checkbox" id="chkQaddas">
          <span>القداس</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" id="chkSundaySchool">
          <span>مدارس الأحد</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" id="chkMeeting">
          <span>الاجتماع</span>
        </label>
      </div>

      <div class="form-group">
        <label>تحضير الدرس:</label>
        <select id="preparation">
          <option value="محضر">محضر</option>
          <option value="غير محضر">غير محضر</option>
          <option value="-">-</option>
        </select>
      </div>

      <div class="form-group">
        <label>قراءة الكتاب المقدس:</label>
        <select id="bible">
          <option value="منتظم">منتظم</option>
          <option value="غير منتظم">غير منتظم</option>
        </select>
      </div>

      <button type="submit" id="btnSubmit" class="btn-submit" disabled>💾 حفظ البيانات</button>
    </form>
  </div>

  <!-- النافذة المنبثقة (Modal) لإضافة خادم جديد -->
  <div id="addServantModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h3 style="margin-top:0; text-align:center;">إضافة خادم جديد</h3>
      <div class="form-group">
        <label>اسم الخادم الثلاثي:</label>
        <input type="text" id="newServantName" placeholder="أدخل الاسم كامل">
      </div>
      <div class="form-group">
        <label>الخدمة:</label>
        <input type="text" id="newServantService" placeholder="مثال: ابتدائي / إعدادي">
      </div>
      <div id="addModalMsg" class="msg-box" style="display: none;"></div>
      <div class="modal-actions">
        <button type="button" class="btn-save" id="btnSaveNewServant" onclick="submitNewServant()">حفظ الخادم</button>
        <button type="button" class="btn-cancel" onclick="closeAddServantModal()">إلغاء</button>
      </div>
    </div>
  </div>

  <script>
    // رابط Google Apps Script الخاص بك
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwl73ujVBfy3bVgx6lbkQHQHS1-WcUlB7Lu5_G8pRpT18Wgk-ZIMy5s5nDZYcgV4qzLig/exec";

    let servantsList = [];

    // إعداد تاريخ اليوم كافتراضي
    document.getElementById('attendanceDate').valueAsDate = new Date();

    // جلب قائمة الخدام عند تحميل الصفحة
    window.onload = function() {
      fetch(`${SCRIPT_URL}?action=searchServants`)
        .then(res => res.json())
        .then(data => {
          servantsList = data;
          const statusElem = document.getElementById('statusLoading');
          statusElem.className = "status-bar status-success";
          statusElem.innerText = "✅ تم تحميل الخدام بنجاح";
          document.getElementById('btnSubmit').disabled = false;
        })
        .catch(err => {
          console.error(err);
          const statusElem = document.getElementById('statusLoading');
          statusElem.className = "status-bar status-error";
          statusElem.innerText = "❌ فشل تحميل قائمة الخدام";
        });
    };

    // البحث بالتزامن أثناء الكتابة في حقل الكود أو الاسم
    const codeInput = document.getElementById('servantCode');
    const suggestionsList = document.getElementById('suggestionsList');

    codeInput.addEventListener('input', function() {
      const val = this.value.trim().toLowerCase();
      suggestionsList.innerHTML = '';
      
      if (!val) {
        suggestionsList.style.display = 'none';
        clearServantInfo();
        return;
      }

      // مطابقة بالإكواد أو الأسماء
      const matches = servantsList.filter(s => 
        String(s.code).toLowerCase().includes(val) || 
        String(s.name).toLowerCase().includes(val)
      );

      if (matches.length > 0) {
        matches.forEach(item => {
          const div = document.createElement('div');
          div.className = 'suggestion-item';
          div.innerText = `${item.code} - ${item.name} (${item.service || 'بدون خدمة'})`;
          div.onclick = function() {
            selectServant(item);
          };
          suggestionsList.appendChild(div);
        });
        suggestionsList.style.display = 'block';
      } else {
        suggestionsList.style.display = 'none';
        clearServantInfo();
      }
    });

    function selectServant(servant) {
      document.getElementById('servantCode').value = servant.code;
      document.getElementById('servantName').value = servant.name;
      document.getElementById('serviceType').value = servant.service || '';
      suggestionsList.style.display = 'none';
    }

    function clearServantInfo() {
      document.getElementById('servantName').value = '';
      document.getElementById('serviceType').value = '';
    }

    // إخفاء القائمة عند النقر خارجها
    document.addEventListener('click', function(e) {
      if (e.target !== codeInput) {
        suggestionsList.style.display = 'none';
      }
    });

    // حفظ بيانات الحضور
    document.getElementById('attendanceForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerText = "⏳ جاري الحفظ...";

      const payload = {
        action: "saveData",
        date: document.getElementById('attendanceDate').value,
        code: document.getElementById('servantCode').value,
        name: document.getElementById('servantName').value,
        service: document.getElementById('serviceType').value,
        qaddas: document.getElementById('chkQaddas').checked ? "حضر" : "لم يحضر",
        sundaySchool: document.getElementById('chkSundaySchool').checked ? "حضر" : "لم يحضر",
        meeting: document.getElementById('chkMeeting').checked ? "حضر" : "لم يحضر",
        preparation: document.getElementById('preparation').value,
        bible: document.getElementById('bible').value
      };

      const queryParams = new URLSearchParams(payload).toString();

      fetch(`${SCRIPT_URL}?${queryParams}`)
        .then(res => res.json())
        .then(data => {
          if (data.status === "success") {
            alert("✅ تم حفظ الحضور بنجاح!");
            // إعادة ضبط الإدخالات
            document.getElementById('servantCode').value = '';
            clearServantInfo();
            document.getElementById('chkQaddas').checked = false;
            document.getElementById('chkSundaySchool').checked = false;
            document.getElementById('chkMeeting').checked = false;
          } else {
            alert("❌ حدث خطأ أثناء حفظ البيانات");
          }
        })
        .catch(() => alert("❌ تعذر الاتصال بالسيرفر"))
        .finally(() => {
          btn.disabled = false;
          btn.innerText = "💾 حفظ البيانات";
        });
    });

    // دوال نافذة إضافة خادم جديد
    function openAddServantModal() {
      document.getElementById('newServantName').value = '';
      document.getElementById('newServantService').value = '';
      document.getElementById('addModalMsg').style.display = 'none';
      document.getElementById('addServantModal').style.display = 'flex';
    }

    function closeAddServantModal() {
      document.getElementById('addServantModal').style.display = 'none';
    }

    function submitNewServant() {
      const name = document.getElementById('newServantName').value.trim();
      const service = document.getElementById('newServantService').value.trim();
      const msgBox = document.getElementById('addModalMsg');
      const saveBtn = document.getElementById('btnSaveNewServant');

      if (!name) {
        msgBox.className = "msg-box msg-error";
        msgBox.innerText = "⚠️ يرجى كتابة اسم الخادم";
        msgBox.style.display = 'block';
        return;
      }

      saveBtn.disabled = true;
      saveBtn.innerText = "⏳ جاري الإضافة...";

      const payload = {
        action: "addServant",
        name: name,
        service: service
      };

      const queryParams = new URLSearchParams(payload).toString();

      fetch(`${SCRIPT_URL}?${queryParams}`)
        .then(res => res.json())
        .then(data => {
          if (data.status === "success") {
            // تحديث القائمة المحلية فوراً
            servantsList.push(data.newServant);

            // تحديد الخادم الجديد في عناصر الواجهة فوراً
            selectServant(data.newServant);

            closeAddServantModal();
            alert(`✅ تم إضافة الخادم بنجاح!\nالكود الجديد المولد هو: ${data.newServant.code}`);
          } else {
            msgBox.className = "msg-box msg-error";
            msgBox.innerText = "❌ حدث خطأ أثناء حفظ الخادم";
            msgBox.style.display = 'block';
          }
        })
        .catch(() => {
          msgBox.className = "msg-box msg-error";
          msgBox.innerText = "❌ تعذر الاتصال بالسيرفر";
          msgBox.style.display = 'block';
        })
        .finally(() => {
          saveBtn.disabled = false;
          saveBtn.innerText = "حفظ الخادم";
        });
    }
  </script>
</body>
</html>
