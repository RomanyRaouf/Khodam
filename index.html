<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام متابعة الخدام</title>
  <style>
    :root {
      --primary-color: #5c1d24;
      --secondary-color: #8b263e;
      --gold-color: #d4af37;
      --bg-color: #fdfaf7;
      --card-bg: #ffffff;
      --text-color: #2c1810;
      --border-color: #e2d2c3;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
      direction: rtl;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(92, 29, 36, 0.1);
      border: 1px solid var(--border-color);
    }

    h2 { color: var(--primary-color); margin: 0 0 20px 0; text-align: center; border-bottom: 2px solid var(--gold-color); padding-bottom: 10px; }

    .tabs {
      display: flex;
      margin-bottom: 20px;
      gap: 8px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      text-align: center;
      background: #f4efe9;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      color: var(--primary-color);
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--primary-color);
      color: #fff;
      border-color: var(--primary-color);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .form-group { margin-bottom: 16px; }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: var(--primary-color);
      font-size: 14px;
    }

    input[type="text"], input[type="date"], select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 15px;
      background-color: #faf8f5;
    }

    .checkbox-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      background: #faf8f5;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-weight: normal;
    }

    .checkbox-item input { cursor: pointer; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }

    @media (max-width: 600px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn:hover { background-color: var(--secondary-color); }

    .report-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    .report-table th, .report-table td {
      border: 1px solid var(--border-color);
      padding: 9px;
      text-align: center;
      font-size: 13px;
    }

    .report-table th { background-color: var(--primary-color); color: white; }
  </style>
</head>
<body>

<div class="container">
  <h2>⛪ نظام متابعة وافتقاد الخدام</h2>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('registerTab', this)">📝 تسجيل جديد</button>
    <button class="tab-btn" onclick="switchTab('searchTab', this)">🔍 بحث بالاسم</button>
    <button class="tab-btn" onclick="switchTab('reportTab', this)">📊 تقرير الحضور والغياب</button>
  </div>

  <!-- 1. نموذج التسجيل الجديد -->
  <div id="registerTab" class="tab-content active">
    <form id="addServantForm" onsubmit="saveNewRecord(event)">
      <div class="grid-3">
        <div class="form-group">
          <label>اسم الخادم:</label>
          <input type="text" id="regName" required placeholder="الاسم ثلاثي أو رباعي">
        </div>
        <div class="form-group">
          <label>الخدمة / الفصل:</label>
          <input type="text" id="regService" required placeholder="مثال: رابعة بنات">
        </div>
        <div class="form-group">
          <label>التاريخ:</label>
          <input type="date" id="regDate" required>
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>القداس الإلهي:</label>
          <select id="regQaddas">
            <option value="حضر">حضر</option>
            <option value="لم يحضر">لم يحضر</option>
            <option value="يعتذر">يعتذر</option>
          </select>
        </div>
        <div class="form-group">
          <label>مدارس الأحد:</label>
          <select id="regSundaySchool">
            <option value="حضر">حضر</option>
            <option value="لم يحضر">لم يحضر</option>
            <option value="يعتذر">يعتذر</option>
          </select>
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>اجتماع الخدمة:</label>
          <select id="regMeeting">
            <option value="حضر">حضر</option>
            <option value="لم يحضر">لم يحضر</option>
            <option value="يعتذر">يعتذر</option>
          </select>
        </div>
        <div class="form-group">
          <label>تحضير الدرس:</label>
          <select id="regPrep">
            <option value="تم">تم</option>
            <option value="لم يتم">لم يتم</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>قراءة الكتاب المقدس (يمكنك اختيار أكثر من خيار):</label>
        <div class="checkbox-group">
          <label class="checkbox-item"><input type="checkbox" name="bibleOpt" value="عهد قديم" onchange="handleBibleChange(this)"> عهد قديم</label>
          <label class="checkbox-item"><input type="checkbox" name="bibleOpt" value="عهد جديد" onchange="handleBibleChange(this)"> عهد جديد</label>
          <label class="checkbox-item"><input type="checkbox" name="bibleOpt" value="غير منتظم" id="bibleNone" onchange="handleBibleChange(this)"> غير منتظم</label>
        </div>
      </div>

      <button type="submit" id="btnSubmit" class="btn">💾 حفظ في الشيت وتوليد الكود</button>
    </form>
    <div id="saveStatus" style="margin-top: 15px; font-weight: bold; text-align: center;"></div>
  </div>

  <!-- 2. بحث بالاسم -->
  <div id="searchTab" class="tab-content">
    <div class="form-group">
      <label>ابحث بجزء من اسم الخادم:</label>
      <input type="text" id="searchNameInput" placeholder="اكتب جزء من الاسم واضغط Enter..." onkeypress="if(event.key==='Enter') searchServant()">
    </div>
    <button type="button" onclick="searchServant()" class="btn">🔍 بحث</button>
    <div id="searchResults" style="margin-top: 15px;"></div>
  </div>

  <!-- 3. تقارير الحضور والغياب -->
  <div id="reportTab" class="tab-content">
    <div class="grid-2">
      <div class="form-group">
        <label>اختر التاريخ:</label>
        <input type="date" id="reportDate">
      </div>
      <div class="form-group">
        <label>تصفية التقرير:</label>
        <select id="reportFilter">
          <option value="all">الكل</option>
          <option value="present">الحاضرين فقط ✅</option>
          <option value="absent">الغائبين فقط ❌</option>
        </select>
      </div>
    </div>
    <button type="button" onclick="loadDailyReport()" class="btn">📊 عرض التقرير</button>
    <div id="reportResults" style="margin-top: 15px;"></div>
  </div>

</div>

<script>
  // الرابط الخاص بك مدمج ومباشر
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbys7VnXFiSUZIxRv-pj08Al2vZf-xUarIAV3citzbPSBwyFzaMhGyz6f1stlo537k0cpQ/exec";

  document.addEventListener("DOMContentLoaded", function() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('regDate').value = today;
    document.getElementById('reportDate').value = today;
  });

  function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
  }

  function handleBibleChange(checkbox) {
    const noneBox = document.getElementById('bibleNone');
    const oldNewBoxes = document.querySelectorAll('input[name="bibleOpt"]:not(#bibleNone)');

    if (checkbox.id === 'bibleNone' && checkbox.checked) {
      oldNewBoxes.forEach(b => b.checked = false);
    } else if (checkbox.checked && checkbox.id !== 'bibleNone') {
      noneBox.checked = false;
    }
  }

  function getSelectedBibleOptions() {
    const selected = [];
    document.querySelectorAll('input[name="bibleOpt"]:checked').forEach(box => {
      selected.push(box.value);
    });
    return selected.length > 0 ? selected.join(' + ') : 'غير منتظم';
  }

  function saveNewRecord(e) {
    e.preventDefault();
    const btn = document.getElementById('btnSubmit');
    const statusBox = document.getElementById('saveStatus');

    btn.disabled = true;
    btn.innerText = "⏳ جاري التسجيل وتوليد الكود...";
    statusBox.innerText = "";

    const params = new URLSearchParams({
      action: 'saveRecord',
      name: document.getElementById('regName').value,
      service: document.getElementById('regService').value,
      date: document.getElementById('regDate').value,
      qaddas: document.getElementById('regQaddas').value,
      sundaySchool: document.getElementById('regSundaySchool').value,
      meeting: document.getElementById('regMeeting').value,
      preparation: document.getElementById('regPrep').value,
      bible: getSelectedBibleOptions()
    });

    const cbName = 'cb_save_' + Date.now();
    window[cbName] = function(res) {
      if (res && res.status === "success") {
        statusBox.style.color = "green";
        statusBox.innerText = `✅ تم الحفظ بنجاح! كود الخادم المسجل: [ ${res.code} ]`;
        document.getElementById('addServantForm').reset();
        document.getElementById('regDate').value = new Date().toISOString().split('T')[0];
      } else {
        statusBox.style.color = "red";
        statusBox.innerText = "❌ حدث خطأ أثناء الحفظ.";
      }
      btn.disabled = false;
      btn.innerText = "💾 حفظ في الشيت وتوليد الكود";
      cleanupScript(cbName);
    };

    addScriptTag(`${SCRIPT_URL}?${params.toString()}&callback=${cbName}`, cbName);
  }

  function searchServant() {
    const query = document.getElementById('searchNameInput').value.trim();
    const out = document.getElementById('searchResults');
    if (!query) {
      alert("يرجى كتابة جزء من الاسم أولاً");
      return;
    }

    out.innerHTML = "⏳ جاري البحث...";
    const cbName = 'cb_search_' + Date.now();

    window[cbName] = function(data) {
      if (!data || data.length === 0) {
        out.innerHTML = "<p style='text-align:center;'>لم يتم العثور على خادم بهذا الاسم.</p>";
      } else {
        let html = `<table class="report-table">
          <thead>
            <tr>
              <th>الكود</th>
              <th>الاسم</th>
              <th>الخدمة</th>
              <th>التاريخ</th>
              <th>القداس</th>
              <th>مدارس أحد</th>
              <th>الاجتماع</th>
              <th>التحضير</th>
              <th>الكتاب المقدس</th>
            </tr>
          </thead>
          <tbody>`;
        data.forEach(r => {
          html += `<tr>
            <td><b>${r.code}</b></td>
            <td>${r.name}</td>
            <td>${r.service}</td>
            <td>${r.date}</td>
            <td>${r.qaddas}</td>
            <td>${r.sundaySchool}</td>
            <td>${r.meeting}</td>
            <td>${r.preparation}</td>
            <td>${r.bible}</td>
          </tr>`;
        });
        html += "</tbody></table>";
        out.innerHTML = html;
      }
      cleanupScript(cbName);
    };

    addScriptTag(`${SCRIPT_URL}?action=searchByName&query=${encodeURIComponent(query)}&callback=${cbName}`, cbName);
  }

  function loadDailyReport() {
    const dateVal = document.getElementById('reportDate').value;
    const filterVal = document.getElementById('reportFilter').value;
    const out = document.getElementById('reportResults');

    if (!dateVal) {
      alert("يرجى اختيار التاريخ");
      return;
    }

    out.innerHTML = "⏳ جاري جلب التقرير...";
    const cbName = 'cb_report_' + Date.now();

    window[cbName] = function(data) {
      if (!data || data.length === 0) {
        out.innerHTML = `<p style='text-align:center;'>لا توجد بيانات مسجلة لتاريخ: ${dateVal}</p>`;
      } else {
        let html = `<table class="report-table">
          <thead>
            <tr>
              <th>الكود</th>
              <th>الاسم</th>
              <th>الخدمة</th>
              <th>القداس</th>
              <th>مدارس أحد</th>
              <th>الاجتماع</th>
              <th>التحضير</th>
              <th>الكتاب المقدس</th>
            </tr>
          </thead>
          <tbody>`;
        data.forEach(r => {
          html += `<tr>
            <td><b>${r.code}</b></td>
            <td>${r.name}</td>
            <td>${r.service}</td>
            <td>${r.qaddas}</td>
            <td>${r.sundaySchool}</td>
            <td>${r.meeting}</td>
            <td>${r.preparation}</td>
            <td>${r.bible}</td>
          </tr>`;
        });
        html += "</tbody></table>";
        out.innerHTML = html;
      }
      cleanupScript(cbName);
    };

    addScriptTag(`${SCRIPT_URL}?action=getDailyReport&date=${encodeURIComponent(dateVal)}&filter=${encodeURIComponent(filterVal)}&callback=${cbName}`, cbName);
  }

  function addScriptTag(url, id) {
    cleanupScript(id);
    const s = document.createElement('script');
    s.id = id;
    s.src = url;
    document.body.appendChild(s);
  }

  function cleanupScript(id) {
    delete window[id];
    const el = document.getElementById(id);
    if (el) el.remove();
  }
</script>

</body>
</html>
