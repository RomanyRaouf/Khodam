<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل حضور ومتابعة الخدام</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f9f9f9; padding: 20px; }
        .search-container { position: relative; max-width: 500px; margin: 20px auto; }
        input[type="text"] { width: 100%; padding: 10px; font-size: 16px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        #searchResults {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #fff;
            border: 1px solid #ccc;
            border-top: none;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
        }
        .search-result-item {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }
        .search-result-item:hover {
            background-color: #f1f1f1;
        }
        .no-result {
            padding: 10px;
            color: #777;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="search-container">
        <label for="searchInput">اكتب جزء من اسم الخادم لاختياره:</label>
        <!-- حقل البحث مع ربطه بدالة الفلترة -->
        <input type="text" id="searchInput" placeholder="اكتب الاسم هنا..." oninput="onSearchInput(this.value)">
        
        <!-- قائمة منسدلة ديناميكية لعرض النتائج -->
        <div id="searchResults"></div>
    </div>

    <script>
        // دالة الفلترة والبحث الفوري أثناء الكتابة
        function onSearchInput(query) {
            const trimmedQuery = query.trim();
            const resultsContainer = document.getElementById('searchResults');

            // إذا كان الحقل فارغاً، إخفاء القائمة وتفريغها
            if (trimmedQuery.length === 0) {
                resultsContainer.innerHTML = '';
                resultsContainer.style.display = 'none';
                return;
            }

            // استدعاء دالة الجدولة الخلفية في Apps Script
            google.script.run
                .withSuccessHandler(function(results) {
                    resultsContainer.innerHTML = '';
                    
                    if (results && results.length > 0) {
                        results.forEach(function(servant) {
                            const item = document.createElement('div');
                            item.className = 'search-result-item';
                            item.textContent = servant.name;
                            
                            // عند الضغط على اسم الخادم من القائمة المختارة
                            item.onclick = function() {
                                document.getElementById('searchInput').value = servant.name;
                                resultsContainer.style.display = 'none';
                                
                                // يمكنك إضافة أي أكواد إضافية هنا (مثل ملء الحقول الأخرى تلقائياً)
                            };
                            
                            resultsContainer.appendChild(item);
                        });
                        resultsContainer.style.display = 'block';
                    } else {
                        resultsContainer.innerHTML = '<div class="no-result">لا يوجد خادم بهذا الاسم</div>';
                        resultsContainer.style.display = 'block';
                    }
                })
                .withFailureHandler(function(error) {
                    console.error("حدث خطأ أثناء البحث: ", error);
                })
                .searchServantsBackend(trimmedQuery);
        }

        // إغلاق القائمة عند النقر خارجها
        document.addEventListener('click', function(event) {
            const container = document.querySelector('.search-container');
            if (!container.contains(event.target)) {
                document.getElementById('searchResults').style.display = 'none';
            }
        });
    </script>

</body>
</html>
