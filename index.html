<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام متابعة حضور الخدام</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 25px;
    }
    .filter-section {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: center;
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid #e9ecef;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 180px;
    }
    label {
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 14px;
      color: #495057;
    }
    input, select, button {
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #ced4da;
      font-size: 14px;
      outline: none;
    }
    button {
      background-color: #0d6efd;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
      align-self: flex-end;
      height: 42px;
    }
    button:hover {
      background-color: #0b5ed7;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #dee2e6;
      padding: 10px;
      text-align: center;
      font-size: 13px;
    }
    th {
      background-color: #0d6efd;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f8f9fa;
    }
    .badge-present {
      background-color: #d1e7dd;
      color: #0f5132;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
    }
    .badge-absent {
      background-color: #f8d7da;
      color: #842029;
      padding: 4px 8px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>📊 تقرير متابعة الخدام</h2>

  <div class="filter-section">
    <div class="form-group">
      <label for="reportDate">اختر التاريخ:</label>
      <input type="date" id="reportDate">
    </div>

    <div class="form-group">
      <label for="reportFilter">نوع التقرير / الفلترة:</label>
      <select id="reportFilter">
        <option value="all">📊 عرض جميع المسجلين</option>
        <option value="qaddas">⛪ حضور القداس فقط</option>
        <option value="sundaySchool">🏫 حضور مدارس الأحد فقط</option>
        <option value="meeting">🤝 حضور اجتماع الخدمة فقط</option>
        <option value="present">✅ حضور أي نشاط</option>
        <option value="absent">❌ الغائبون بالكامل</option>
      </select>
    </div>

    <button onclick="getDailyReport()">🔍 عرض التقرير</button>
  </div>

  <div id="reportResults"></div>
</div>

<script>
  // الرابط الجديد الخاص بك
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwdR74jtkyedk3qpsg1GD4DF5wSgNDGczQ2K5voIrKzYaaQDq4z1g1JC2acw5mcdFX0Cg/exec";

  // ضبط تاريخ اليوم تلقائياً
  document.getElementById('reportDate').valueAsDate = new Date();

  function getDailyReport() {
    const dateVal = document.getElementById('reportDate').value;
    const filterVal = document.getElementById('reportFilter').value;
    const resultsDiv = document.getElementById('reportResults');

    if (!dateVal) {
      alert("يرجى اختيار التاريخ أولاً");
      return;
    }

    resultsDiv.innerHTML = "<div style='text-align:center; padding: 20px;'>⏳ جاري تجميع بيانات التقرير...</div>";

    const url = `${SCRIPT_URL}?action=getAllServantsDataByDate&date=${encodeURIComponent(dateVal)}&filter=${encodeURIComponent(filterVal)}`;

    fetch(url)
      .then(response => response.json())
      .then(records => {
        renderDailyReportTable(records, dateVal, resultsDiv);
      })
      .catch(err => {
        // خيار احتياطي باستخدام JSONP في حالة قيود المتصفح
        const cbName = 'cb_daily_' + Date.now();
        window[cbName] = function(records) {
          renderDailyReportTable(records, dateVal, resultsDiv);
          cleanupScript(cbName);
        };
        addScriptTag(`${url}&callback=${cbName}`, cbName);
      });
  }

  function renderDailyReportTable(records, dateVal, container) {
    if (!records || records.length === 0) {
      container.innerHTML = "<div style='text-align:center; padding: 20px; color: #6c757d;'>لا توجد بيانات مسجلة لهذا التاريخ وفقاً للفلتر المحدد.</div>";
      return;
    }

    let html = `
      <div style="margin-bottom: 10px; font-weight: bold; color: #495057;">
        إجمالي النتائج: ${records.length} خادم
      </div>
      <table>
        <thead>
          <tr>
            <th>الكود</th>
            <th>الاسم</th>
            <th>الخدمة</th>
            <th>القداس</th>
            <th>مدارس الأحد</th>
            <th>الاجتماع</th>
            <th>التحضير</th>
            <th>القراءة</th>
          </tr>
        </thead>
        <tbody>
    `;

    records.forEach(row => {
      html += `
        <tr>
          <td>${row.code || '-'}</td>
          <td style="text-align: right; font-weight: bold;">${row.name || '-'}</td>
          <td>${row.service || '-'}</td>
          <td>${formatBadge(row.qaddas)}</td>
          <td>${formatBadge(row.sundaySchool)}</td>
          <td>${formatBadge(row.meeting)}</td>
          <td>${row.preparation || '-'}</td>
          <td>${row.bible || '-'}</td>
        </tr>
      `;
    });

    html += `</tbody></table>`;
    container.innerHTML = html;
  }

  function formatBadge(status) {
    if (!status || status === "لم يحضر") {
      return `<span class="badge-absent">لم يحضر</span>`;
    }
    return `<span class="badge-present">${status}</span>`;
  }

  function addScriptTag(url, cbName) {
    const script = document.createElement('script');
    script.src = url;
    script.id = cbName;
    document.body.appendChild(script);
  }

  function cleanupScript(cbName) {
    const script = document.getElementById(cbName);
    if (script) script.remove();
    delete window[cbName];
  }
</script>

</body>
</html>
