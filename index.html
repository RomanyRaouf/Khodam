<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام متابعة وافتقاد الخدام</title>
  <style>
    :root {
      --primary-color: #2c3e50;
      --secondary-color: #3498db;
      --accent-color: #e74c3c;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #dddddd;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
      direction: rtl;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 20px 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: var(--primary-color);
      margin-bottom: 20px;
    }

    /* Tabs Layout */
    .tabs {
      display: flex;
      border-bottom: 2px solid var(--border-color);
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      text-align: center;
      background: none;
      border: none;
      font-size: 16px;
      font-weight: bold;
      color: #777;
      cursor: pointer;
      transition: 0.3s;
    }

    .tab-btn.active {
      color: var(--secondary-color);
      border-bottom: 3px solid var(--secondary-color);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Form Inputs */
    .form-group {
      margin-bottom: 15px;
      position: relative;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: var(--primary-color);
    }

    input[type="text"],
    input[type="date"],
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 15px;
    }

    /* Autocomplete Suggestions */
    .suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 0 0 6px 6px;
      max-height: 150px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .suggestion-item {
      padding: 8px 12px;
      cursor: pointer;
    }

    .suggestion-item:hover {
      background-color: #f0f0f0;
    }

    /* Form Grid */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    @media (max-width: 600px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 12px;
      background-color: var(--secondary-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 10px;
    }

    .btn:hover {
      background-color: #2980b9;
    }

    .btn-print {
      background-color: #27ae60;
      margin-bottom: 15px;
    }

    .btn-print:hover {
      background-color: #219150;
    }

    /* Tables */
    .report-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    .report-table th, .report-table td {
      border: 1px solid var(--border-color);
      padding: 10px;
      text-align: center;
      font-size: 14px;
    }

    .report-table th {
      background-color: var(--primary-color);
      color: white;
    }

    .report-table tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    /* Print Styles */
    @media print {
      body * {
        visibility: hidden;
      }
      #printArea, #printArea * {
        visibility: visible;
      }
      #printArea {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
      .btn, .tabs {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>⛪ نظام متابعة وافتقاد الخدام</h2>

    <!-- التبويبات -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('entryTab', this)">📝 تسجيل الحضور</button>
      <button class="tab-btn" onclick="switchTab('servantReportTab', this)">👤 سجل خادم</button>
      <button class="tab-btn" onclick="switchTab('dailyReportTab', this)">📊 تقرير يومي</button>
    </div>

    <!-- 1. تبويب تسجيل البيانات -->
    <div id="entryTab" class="tab-content active">
      <form id="attendanceForm" onsubmit="handleSaveData(event)">
        <div class="grid-2">
          <div class="form-group">
            <label>البحث / الاسم أو الكود:</label>
            <input type="text" id="searchInput" placeholder="اكتب اسم الخادم أو الكود..." oninput="onSearchServants(this.value)" autocomplete="off">
            <div id="suggestions" class="suggestions" style="display: none;"></div>
          </div>

          <div class="form-group">
            <label>كود الخادم:</label>
            <input type="text" id="servantCode" required readonly style="background: #e9ecef;">
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label>اسم الخادم:</label>
            <input type="text" id="servantName" required readonly style="background: #e9ecef;">
          </div>

          <div class="form-group">
            <label>التاريخ:</label>
            <input type="date" id="entryDate" required>
          </div>
        </div>

        <hr style="margin: 15px 0; border: 0; border-top: 1px solid var(--border-color);">

        <div class="grid-2">
          <div class="form-group">
            <label>القداس:</label>
            <select id="qaddas">
              <option value="حضر">حضر</option>
              <option value="لم يحضر">لم يحضر</option>
              <option value="يعتذر">يعتذر</option>
            </select>
          </div>

          <div class="form-group">
            <label>مدارس الأحد:</label>
            <select id="sundaySchool">
              <option value="حضر">حضر</option>
              <option value="لم يحضر">لم يحضر</option>
              <option value="يعتذر">يعتذر</option>
            </select>
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label>اجتماع الخدمة:</label>
            <select id="meeting">
              <option value="حضر">حضر</option>
              <option value="لم يحضر">لم يحضر</option>
              <option value="يعتذر">يعتذر</option>
            </select>
          </div>

          <div class="form-group">
            <label>تحضير الدرس:</label>
            <select id="preparation">
              <option value="تم">تم</option>
              <option value="لم يتم">لم يتم</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>قراءة الكتاب المقدس:</label>
          <select id="bible">
            <option value="منتظم">منتظم</option>
            <option value="غير منتظم">غير منتظم</option>
          </select>
        </div>

        <button type="submit" id="btnSave" class="btn">💾 حفظ البيانات</button>
      </form>
    </div>

    <!-- 2. تبويب سجل خادم معين -->
    <div id="servantReportTab" class="tab-content">
      <div class="form-group">
        <label>ادخل كود الخادم عرض السجل:</label>
        <input type="text" id="searchServantCodeInput" placeholder="مثال: 101">
      </div>
      <button onclick="getServantHistory()" class="btn">🔍 عرض سجل الخادم</button>
      
      <div id="servantHistoryResults" style="margin-top: 20px;"></div>
    </div>

    <!-- 3. تبويب تقرير يومي لجميع الخدام -->
    <div id="dailyReportTab" class="tab-content">
      <div class="form-group">
        <label>اختر التاريخ:</label>
        <input type="date" id="reportDate">
      </div>
      <button onclick="getDailyReport()" class="btn">📊 عرض التقرير</button>

      <div id="printArea">
        <button id="btnReportPrint" onclick="window.print()" class="btn btn-print" style="display: none; margin-top: 15px;">🖨️ طباعة التقرير</button>
        <div id="reportResults" style="margin-top: 15px;"></div>
      </div>
    </div>

  </div>

  <script>
    // 🔗 ضع رابط الـ Web App الخاص بـ Google Apps Script هنا
    const SCRIPT_URL = "ضع_رابط_السكربت_الخاص_بك_هنا";

    // ضبط تاريخ اليوم تلقائياً للنماذج
    document.addEventListener("DOMContentLoaded", function() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('entryDate').value = today;
      document.getElementById('reportDate').value = today;
    });

    // التنقل بين التبويبات
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    // --- 1. البحث التلقائي عن الخدام (Autocomplete) ---
    let searchTimeout = null;
    function onSearchServants(query) {
      clearTimeout(searchTimeout);
      const suggBox = document.getElementById('suggestions');
      
      if (!query.trim()) {
        suggBox.style.display = 'none';
        return;
      }

      searchTimeout = setTimeout(() => {
        const cbName = 'cb_search_' + Date.now();
        window[cbName] = function(data) {
          suggBox.innerHTML = '';
          if (data && data.length > 0) {
            data.forEach(item => {
              const div = document.createElement('div');
              div.className = 'suggestion-item';
              div.innerText = `${item.name} (${item.code})`;
              div.onclick = function() {
                document.getElementById('servantCode').value = item.code;
                document.getElementById('servantName').value = item.name;
                document.getElementById('searchInput').value = item.name;
                suggBox.style.display = 'none';
              };
              suggBox.appendChild(div);
            });
            suggBox.style.display = 'block';
          } else {
            suggBox.style.display = 'none';
          }
          delete window[cbName];
          document.getElementById(cbName)?.remove();
        };

        const url = `${SCRIPT_URL}?action=searchServants&query=${encodeURIComponent(query)}&callback=${cbName}`;
        addScriptTag(url, cbName);
      }, 300);
    }

    // --- 2. حفظ البيانات ---
    function handleSaveData(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSave');
      btn.disabled = true;
      btn.innerText = "⏳ جاري الحفظ...";

      const params = new URLSearchParams({
        action: 'saveData',
        code: document.getElementById('servantCode').value,
        name: document.getElementById('servantName').value,
        date: document.getElementById('entryDate').value,
        qaddas: document.getElementById('qaddas').value,
        sundaySchool: document.getElementById('sundaySchool').value,
        meeting: document.getElementById('meeting').value,
        preparation: document.getElementById('preparation').value,
        bible: document.getElementById('bible').value
      });

      const cbName = 'cb_save_' + Date.now();
      window[cbName] = function(res) {
        if (res && res.status === "success") {
          alert("✅ تم حفظ البيانات بنجاح!");
          document.getElementById('attendanceForm').reset();
          const today = new Date().toISOString().split('T')[0];
          document.getElementById('entryDate').value = today;
        } else {
          alert("❌ حدث خطأ أثناء الحفظ.");
        }
        btn.disabled = false;
        btn.innerText = "💾 حفظ البيانات";
        delete window[cbName];
        document.getElementById(cbName)?.remove();
      };

      const url = `${SCRIPT_URL}?${params.toString()}&callback=${cbName}`;
      addScriptTag(url, cbName);
    }

    // --- 3. سجل خادم معين ---
    function getServantHistory() {
      const code = document.getElementById('searchServantCodeInput').value.trim();
      const resultsDiv = document.getElementById('servantHistoryResults');

      if (!code) {
        alert("يرجى أدخال كود الخادم");
        return;
      }

      resultsDiv.innerHTML = "⏳ جاري تحميل السجل...";

      const cbName = 'cb_servant_hist_' + Date.now();
      window[cbName] = function(records) {
        if (!records || records.length === 0) {
          resultsDiv.innerHTML = "<p style='text-align:center;'>لا توجد سجلات لهذا الخادم.</p>";
        } else {
          let html = `<table class="report-table">
            <thead>
              <tr>
                <th>التاريخ</th>
                <th>قداس</th>
                <th>مدارس أحد</th>
                <th>اجتماع</th>
                <th>تحضير</th>
                <th>كتاب مقدس</th>
              </tr>
            </thead>
            <tbody>`;
          records.forEach(r => {
            html += `<tr>
              <td>${r.date}</td>
              <td>${r.qaddas}</td>
              <td>${r.sundaySchool}</td>
              <td>${r.meeting}</td>
              <td>${r.preparation}</td>
              <td>${r.bible}</td>
            </tr>`;
          });
          html += `</tbody></table>`;
          resultsDiv.innerHTML = html;
        }
        delete window[cbName];
        document.getElementById(cbName)?.remove();
      };

      const url = `${SCRIPT_URL}?action=searchServantData&code=${encodeURIComponent(code)}&callback=${cbName}`;
      addScriptTag(url, cbName);
    }

    // --- 4. تقرير كل الخدام بتاريخ معين ---
    function getDailyReport() {
      const dateVal = document.getElementById('reportDate').value;
      const resultsDiv = document.getElementById('reportResults');
      const printBtn = document.getElementById('btnReportPrint');

      if (!dateVal) {
        alert("يرجى اختيار التاريخ أولاً");
        return;
      }

      resultsDiv.innerHTML = "⏳ جاري تحميل تقرير اليوم...";
      printBtn.style.display = 'none';

      const cbName = 'cb_daily_' + Date.now();

      window[cbName] = function(records) {
        if (!records || !Array.isArray(records) || records.length === 0) {
          resultsDiv.innerHTML = `<p style='text-align:center; color:#777;'>لا توجد سجلات مسجلة لتاريخ: <b>${dateVal}</b></p>`;
        } else {
          let html = `<h4 style="margin: 0 0 10px 0; color: var(--primary-color); text-align: center;">📊 تقرير افتقاد الخدام ليوم: ${dateVal}</h4>`;
          html += `<table class="report-table">
            <thead>
              <tr>
                <th>الخادم</th>
                <th>قداس</th>
                <th>مدارس أحد</th>
                <th>اجتماع</th>
                <th>تحضير</th>
                <th>الكتاب المقدس</th>
              </tr>
            </thead>
            <tbody>`;

          records.forEach(function(rec) {
            html += `<tr>
              <td><b>${rec.name || ''}</b><br><small>(${rec.code || ''})</small></td>
              <td>${rec.qaddas || '-'}</td>
              <td>${rec.sundaySchool || '-'}</td>
              <td>${rec.meeting || '-'}</td>
              <td>${rec.preparation || '-'}</td>
              <td>${rec.bible || '-'}</td>
            </tr>`;
          });

          html += `</tbody></table>`;
          resultsDiv.innerHTML = html;
          printBtn.style.display = 'block';
        }

        delete window[cbName];
        document.getElementById(cbName)?.remove();
      };

      const url = `${SCRIPT_URL}?action=getAllServantsDataByDate&date=${encodeURIComponent(dateVal)}&callback=${cbName}`;
      addScriptTag(url, cbName);
    }

    // دالة مساعدة لإنشاء عناصر <script> للاستدعاء عبر JSONP
    function addScriptTag(url, id) {
      const script = document.createElement('script');
      script.id = id;
      script.src = url;
      script.onerror = function() {
        alert("❌ تعذر الاتصال بالسيرفر، تأكد من صحة رابط السكريبت.");
      };
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
