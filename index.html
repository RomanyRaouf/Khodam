<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة وتتبع الحضور والخدمة</title>
  
  <!-- Bootstrap 5 RTL CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <style>
    body {
      background-color: #f4f6f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .card {
      border-radius: 12px;
      overflow: hidden;
    }
    .style-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .style-scroll::-webkit-scrollbar-thumb {
      background-color: rgba(0,0,0,0.2);
      border-radius: 4px;
    }
    .loading-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      visibility: hidden;
      opacity: 0;
      transition: all 0.3s ease;
    }
    .loading-overlay.active {
      visibility: visible;
      opacity: 1;
    }
    /* تنسيق قائمة الخيارات السريعة */
    .dropdown-select-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      z-index: 1050;
      background: #fff;
      border: 1px solid #ced4da;
      border-radius: 0 0 8px 8px;
      max-height: 220px;
      overflow-y: auto;
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
      display: none;
    }
    .dropdown-select-item {
      padding: 10px 12px;
      cursor: pointer;
      border-bottom: 1px solid #f1f3f5;
      transition: background 0.15s ease;
    }
    .dropdown-select-item:hover {
      background-color: #e7f1ff;
    }
  </style>
</head>
<body class="p-3 p-md-4">

  <!-- شاشة التحميل -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="text-center">
      <div class="spinner-border text-primary mb-2" style="width: 3rem; height: 3rem;" role="status"></div>
      <p class="fw-bold text-secondary">جاري جلب وتحديث البيانات...</p>
    </div>
  </div>

  <div class="container-fluid max-width-xl">
    
    <!-- الهيدر الرئيسي -->
    <header class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded shadow-sm border-start border-4 border-primary">
      <h3 class="m-0 text-primary fw-bold">
        <i class="bi bi-calendar-check me-2"></i>نظام متابعة الحضور والخدمة
      </h3>
      <span class="badge bg-primary px-3 py-2 fs-6" id="currentDateBadge"></span>
    </header>

    <!-- 0. اختيار الخادم المشرف من القائمة -->
    <section class="card shadow-sm mb-4 border-top border-4 border-info">
      <div class="card-header bg-light fw-bold text-dark d-flex justify-content-between align-items-center">
        <span><i class="bi bi-person-badge-fill text-info me-2 fs-5"></i>تحديد الخادم / المشرف المسئول</span>
        <span class="badge bg-info text-dark">بيانات الأساس</span>
      </div>
      <div class="card-body bg-white">
        <div class="row g-3">
          
          <!-- اختيار الخادم من قائمة القوالب المسجلة -->
          <div class="col-md-4 position-relative">
            <label class="form-label fw-bold">اختر الخادم أو ابحث بالإسم/الكود:</label>
            <input type="text" id="servantSearchInput" class="form-control" placeholder="اضغط هنا لاختيار أو كتابة اسم الخادم..." autocomplete="off">
            <div id="servantListDropdown" class="dropdown-select-list"></div>
          </div>

          <div class="col-md-4">
            <label class="form-label fw-bold">الخدمة / المرحلة:</label>
            <input type="text" id="servantRole" class="form-control" placeholder="الخدمة الحالية...">
          </div>

          <div class="col-md-4">
            <label class="form-label fw-bold">القطاع / المنطقة:</label>
            <input type="text" id="servantSector" class="form-control" placeholder="المنطقة / الكنيسة...">
          </div>

        </div>
      </div>
    </section>

    <!-- 1. نموذج تسجيل الحضور لاختيار الأسماء المسجلة سابقاً -->
    <section class="card shadow-sm mb-4">
      <div class="card-header bg-dark text-white fw-bold d-flex justify-content-between align-items-center">
        <span><i class="bi bi-person-check me-2"></i>تسجيل حضور الخدام والمخدومين</span>
        <span class="badge bg-warning text-dark"><i class="bi bi-search me-1"></i>اختر الاسم مباشرةً</span>
      </div>
      <div class="card-body">
        <form id="attendanceForm" onsubmit="handleFormSubmit(event)">
          <div class="row g-3">
            
            <!-- اختيار/البحث عن الاسم المسجل سابقاً -->
            <div class="col-md-4 position-relative">
              <label class="form-label fw-bold">اختر الشخص (خادم / مخدوم):</label>
              <input type="text" id="personSearchInput" class="form-control" placeholder="اضغط لاختيار اسم من القائمة أو ابحث..." required autocomplete="off">
              <div id="personListDropdown" class="dropdown-select-list"></div>
            </div>

            <div class="col-md-3">
              <label class="form-label fw-bold">المرحلة / الصف:</label>
              <select id="personStage" class="form-select" required>
                <option value="" selected disabled>اختر المرحلة...</option>
                <option value="servant">خادم</option>
                <option value="primary">ابتدائي</option>
                <option value="prep">إعدادي</option>
                <option value="sec">ثانوي</option>
              </select>
            </div>

            <div class="col-md-2">
              <label class="form-label fw-bold">التاريخ:</label>
              <input type="date" id="attendanceDate" class="form-control" required>
            </div>

            <!-- أنشطة الحضور -->
            <div class="col-md-3 d-flex align-items-end">
              <div class="d-flex gap-2 bg-light p-2 rounded w-100 justify-content-around border">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="chkMass">
                  <label class="form-check-label fw-bold text-success" for="chkMass">القداس</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="chkSundaySchool">
                  <label class="form-check-label fw-bold text-info" for="chkSundaySchool">مدارس الأحد</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="chkServiceMeeting">
                  <label class="form-check-label fw-bold text-warning" for="chkServiceMeeting">اجتماع الخدمة</label>
                </div>
              </div>
            </div>

            <div class="col-12 text-end">
              <button type="submit" class="btn btn-primary px-4 fw-bold">
                <i class="bi bi-check-circle me-1"></i>تسجيل الحضور
              </button>
            </div>
          </div>
        </form>
      </div>
    </section>

    <!-- 2. قسم التقارير -->
    <section id="reportsSection" class="card shadow-sm mb-4">
      <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0"><i class="bi bi-file-earmark-bar-graph me-2"></i>تقارير الحضور والغياب</h5>
        <button class="btn btn-light btn-sm fw-bold" onclick="fetchServerData()">
          <i class="bi bi-arrow-repeat text-primary me-1"></i>تحديث البيانات
        </button>
      </div>
      <div class="card-body">
        
        <div class="row g-3 mb-4 align-items-end">
          <div class="col-md-4">
            <label for="reportDate" class="form-label fw-bold">تاريخ التقرير:</label>
            <input type="date" id="reportDate" class="form-control" onchange="generateReports()">
          </div>
          <div class="col-md-4">
            <label for="reportStage" class="form-label fw-bold">المرحلة / الصف:</label>
            <select id="reportStage" class="form-select" onchange="generateReports()">
              <option value="all">الكل (خدام ومخدومين)</option>
              <option value="servant">الخدام فقط</option>
              <option value="primary">ابتدائي</option>
              <option value="prep">إعدادي</option>
              <option value="sec">ثانوي</option>
            </select>
          </div>
          <div class="col-md-4 text-end">
            <button class="btn btn-outline-primary w-100 fw-bold" onclick="generateReports()">
              <i class="bi bi-funnel me-1"></i>عرض التقرير
            </button>
          </div>
        </div>

        <!-- شبكة نتائج الحضور -->
        <div class="row g-3">
          <div class="col-md-6 col-lg-3">
            <div class="card h-100 border-success">
              <div class="card-header bg-success text-white fw-bold d-flex justify-content-between align-items-center">
                <span><i class="bi bi-church me-1"></i>حضور القداس</span>
                <span id="massCount" class="badge bg-white text-success fs-6">0</span>
              </div>
              <div class="card-body p-2 style-scroll" style="max-height: 320px; overflow-y: auto;">
                <ul id="massList" class="list-group list-group-flush"></ul>
              </div>
            </div>
          </div>

          <div class="col-md-6 col-lg-3">
            <div class="card h-100 border-info">
              <div class="card-header bg-info text-white fw-bold d-flex justify-content-between align-items-center">
                <span><i class="bi bi-book me-1"></i>مدارس الأحد</span>
                <span id="sundaySchoolCount" class="badge bg-white text-info fs-6">0</span>
              </div>
              <div class="card-body p-2 style-scroll" style="max-height: 320px; overflow-y: auto;">
                <ul id="sundaySchoolList" class="list-group list-group-flush"></ul>
              </div>
            </div>
          </div>

          <div class="col-md-6 col-lg-3">
            <div class="card h-100 border-warning">
              <div class="card-header bg-warning text-dark fw-bold d-flex justify-content-between align-items-center">
                <span><i class="bi bi-people me-1"></i>اجتماع الخدمة</span>
                <span id="serviceMeetingCount" class="badge bg-dark text-white fs-6">0</span>
              </div>
              <div class="card-body p-2 style-scroll" style="max-height: 320px; overflow-y: auto;">
                <ul id="serviceMeetingList" class="list-group list-group-flush"></ul>
              </div>
            </div>
          </div>

          <div class="col-md-6 col-lg-3">
            <div class="card h-100 border-danger">
              <div class="card-header bg-danger text-white fw-bold d-flex justify-content-between align-items-center">
                <span><i class="bi bi-person-x me-1"></i>الغياب الكلي</span>
                <span id="absentCount" class="badge bg-white text-danger fs-6">0</span>
              </div>
              <div class="card-body p-2 style-scroll" style="max-height: 320px; overflow-y: auto;">
                <ul id="absentList" class="list-group list-group-flush"></ul>
              </div>
            </div>
          </div>
        </div>

      </div>
    </section>

  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxvGHCxcxsCV6J6QG5DTJeKF7zCHWh3QOeekEq-dgoy-J2CjKSF4tCBl1LDhd0DZCpqvg/exec';

    let recordsData = [];
    let registeredPeople = new Map(); // دليل الأسماء المخزنة والمتاحة للاختيار

    window.addEventListener('DOMContentLoaded', () => {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('attendanceDate').value = today;
      document.getElementById('reportDate').value = today;
      document.getElementById('currentDateBadge').textContent = today;
      
      // استرجاع بيانات الخادم المسجلة محلياً
      document.getElementById('servantSearchInput').value = localStorage.getItem('servantName') || '';
      document.getElementById('servantRole').value = localStorage.getItem('servantRole') || '';
      document.getElementById('servantSector').value = localStorage.getItem('servantSector') || '';

      bindCustomSelect('servantSearchInput', 'servantListDropdown', (item) => {
        document.getElementById('servantSearchInput').value = item.name;
        if (item.role) document.getElementById('servantRole').value = item.role;
        if (item.sector) document.getElementById('servantSector').value = item.sector;

        localStorage.setItem('servantName', item.name);
        if (item.role) localStorage.setItem('servantRole', item.role);
        if (item.sector) localStorage.setItem('servantSector', item.sector);
      });

      bindCustomSelect('personSearchInput', 'personListDropdown', (item) => {
        document.getElementById('personSearchInput').value = item.name;
        if (item.stage) document.getElementById('personStage').value = item.stage;
      });

      fetchServerData();
    });

    // دالة بناء وتفعيل القوائم المنسدلة للبحث الاختياري
    function bindCustomSelect(inputId, dropdownId, onSelect) {
      const input = document.getElementById(inputId);
      const dropdown = document.getElementById(dropdownId);

      const renderItems = (filterText = '') => {
        dropdown.innerHTML = '';
        const searchKey = filterText.trim().toLowerCase();
        let matchesFound = 0;

        registeredPeople.forEach((person) => {
          const nameMatch = person.name.toLowerCase().includes(searchKey);
          const codeMatch = person.code && person.code.toLowerCase().includes(searchKey);

          if (!searchKey || nameMatch || codeMatch) {
            matchesFound++;
            const itemDiv = document.createElement('div');
            itemDiv.className = 'dropdown-select-item d-flex justify-content-between align-items-center';
            itemDiv.innerHTML = `
              <div>
                <strong class="text-dark">${person.name}</strong>
                <span class="text-muted small ms-2">(${person.stageTitle || 'خادم/مخدوم'})</span>
              </div>
              <span class="badge bg-light text-secondary border">${person.code}</span>
            `;
            itemDiv.addEventListener('click', () => {
              onSelect(person);
              dropdown.style.display = 'none';
            });
            dropdown.appendChild(itemDiv);
          }
        });

        if (matchesFound === 0) {
          dropdown.innerHTML = `<div class="p-2 text-muted text-center small">اسم جديد (سيتم حفظه تلقائياً)</div>`;
        }
        dropdown.style.display = 'block';
      };

      input.addEventListener('focus', () => renderItems(input.value));
      input.addEventListener('input', () => renderItems(input.value));

      document.addEventListener('click', (e) => {
        if (!input.contains(e.target) && !dropdown.contains(e.target)) {
          dropdown.style.display = 'none';
        }
      });
    }

    function toggleSpinner(show) {
      const spinner = document.getElementById('loadingOverlay');
      if (show) spinner.classList.add('active');
      else spinner.classList.remove('active');
    }

    async function fetchServerData() {
      toggleSpinner(true);
      try {
        const response = await fetch(SCRIPT_URL);
        if (response.ok) {
          const data = await response.json();
          recordsData = data || [];
          
          buildPeopleIndex(recordsData);
          generateReports();
        }
      } catch (error) {
        console.error('Error fetching data:', error);
      } finally {
        toggleSpinner(false);
      }
    }

    // بناء وسجل قائمة الأسماء للاختيار السريع
    function buildPeopleIndex(data) {
      registeredPeople.clear();

      data.forEach((item, index) => {
        if (item.name) {
          registeredPeople.set(item.name, {
            name: item.name,
            code: item.code || `CODE-${101 + index}`,
            stage: item.stage,
            stageTitle: getStageTitle(item.stage),
            role: item.servantRole,
            sector: item.servantSector
          });
        }
        if (item.servantName && !registeredPeople.has(item.servantName)) {
          registeredPeople.set(item.servantName, {
            name: item.servantName,
            code: `SERV-${201 + index}`,
            stage: 'servant',
            stageTitle: 'خادم مشرف',
            role: item.servantRole,
            sector: item.servantSector
          });
        }
      });
    }

    function getStageTitle(stage) {
      switch(stage) {
        case 'primary': return 'ابتدائي';
        case 'prep': return 'إعدادي';
        case 'sec': return 'ثانوي';
        case 'servant': return 'خادم';
        default: return stage || 'غير محدد';
      }
    }

    async function handleFormSubmit(e) {
      e.preventDefault();

      const nameValue = document.getElementById('personSearchInput').value.trim();
      const stageValue = document.getElementById('personStage').value;

      const payload = {
        servantName: document.getElementById('servantSearchInput').value,
        servantRole: document.getElementById('servantRole').value,
        servantSector: document.getElementById('servantSector').value,
        name: nameValue,
        stage: stageValue,
        date: document.getElementById('attendanceDate').value,
        attendedMass: document.getElementById('chkMass').checked,
        attendedSundaySchool: document.getElementById('chkSundaySchool').checked,
        attendedServiceMeeting: document.getElementById('chkServiceMeeting').checked
      };

      toggleSpinner(true);

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        recordsData.push(payload);
        
        // حفظ الاسم في الدليل المباشر لاستخدامه فوراً بدون إعادة كتابة
        registeredPeople.set(nameValue, {
          name: nameValue,
          code: `CODE-${101 + registeredPeople.size}`,
          stage: stageValue,
          stageTitle: getStageTitle(stageValue)
        });

        generateReports();
        
        document.getElementById('attendanceForm').reset();
        document.getElementById('attendanceDate').value = payload.date;
        alert('تم تسجيل الحضور بنجاح!');
      } catch (err) {
        alert('حدث خطأ أثناء حفظ البيانات!');
        console.error(err);
      } finally {
        toggleSpinner(false);
      }
    }

    function generateReports() {
      const selectedDate = document.getElementById('reportDate').value;
      const selectedStage = document.getElementById('reportStage').value;

      const massList = document.getElementById('massList');
      const sundaySchoolList = document.getElementById('sundaySchoolList');
      const serviceMeetingList = document.getElementById('serviceMeetingList');
      const absentList = document.getElementById('absentList');

      massList.innerHTML = '';
      sundaySchoolList.innerHTML = '';
      serviceMeetingList.innerHTML = '';
      absentList.innerHTML = '';

      let cMass = 0, cSunday = 0, cService = 0, cAbsent = 0;

      const filtered = recordsData.filter(item => {
        const matchDate = !selectedDate || item.date === selectedDate;
        const matchStage = selectedStage === 'all' || item.stage === selectedStage;
        return matchDate && matchStage;
      });

      filtered.forEach(item => {
        const isMass = item.attendedMass === true || item.attendedMass === 'true';
        const isSunday = item.attendedSundaySchool === true || item.attendedSundaySchool === 'true';
        const isService = item.attendedServiceMeeting === true || item.attendedServiceMeeting === 'true';

        const stageLabel = getStageTitle(item.stage);

        if (isMass) { cMass++; massList.appendChild(createListItem(item.name, stageLabel)); }
        if (isSunday) { cSunday++; sundaySchoolList.appendChild(createListItem(item.name, stageLabel)); }
        if (isService) { cService++; serviceMeetingList.appendChild(createListItem(item.name, stageLabel)); }
        if (!isMass && !isSunday && !isService) {
          cAbsent++;
          absentList.appendChild(createListItem(item.name, stageLabel, 'text-danger fw-bold'));
        }
      });

      document.getElementById('massCount').textContent = cMass;
      document.getElementById('sundaySchoolCount').textContent = cSunday;
      document.getElementById('serviceMeetingCount').textContent = cService;
      document.getElementById('absentCount').textContent = cAbsent;
    }

    function createListItem(text, badgeText, extraClass = '') {
      const li = document.createElement('li');
      li.className = `list-group-item py-1 px-2 border-0 border-bottom small d-flex justify-content-between align-items-center ${extraClass}`;
      li.innerHTML = `<span>${text}</span> <span class="badge bg-light text-dark border">${badgeText}</span>`;
      return li;
    }
  </script>
</body>
</html>
