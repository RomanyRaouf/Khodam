<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام متابعة وحضور الخدام</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 20px;
    }

    /* التنقل بين التبويبات */
    .tabs {
      display: flex;
      border-bottom: 2px solid #dee2e6;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      text-align: center;
      background: #f8f9fa;
      border: none;
      outline: none;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      color: #6c757d;
      transition: 0.3s;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
    }
    .tab-btn.active {
      background: #0d6efd;
      color: white;
    }

    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    /* نماذج الإدخال والفلترة */
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 14px;
      color: #495057;
    }
    input, select, textarea, button {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #ced4da;
      font-size: 14px;
      outline: none;
    }
    .checkbox-group {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      background: #f8f9fa;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #e9ecef;
    }
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .checkbox-item input {
      width: auto;
      cursor: pointer;
    }

    .submit-btn {
      background-color: #198754;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 10px;
      height: 45px;
      font-size: 16px;
    }
    .submit-btn:hover {
      background-color: #157347;
    }

    .filter-section {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: flex-end;
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid #e9ecef;
    }
    .filter-section .form-group {
      flex: 1;
      min-width: 180px;
      margin-bottom: 0;
    }

    .search-btn {
      background-color: #0d6efd;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      height: 42px;
    }
    .search-btn:hover {
      background-color: #0b5ed7;
    }

    /* الجداول والشارات */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #dee2e6;
      padding: 10px;
      text-align: center;
      font-size: 13px;
    }
    th {
      background-color: #0d6efd;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f8f9fa;
    }
    .badge-present {
      background-color: #d1e7dd;
      color: #0f5132;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
    }
    .badge-absent {
      background-color: #f8d7da;
      color: #842029;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .msg-box {
      padding: 12px;
      border-radius: 6px;
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
      display: none;
    }
    .msg-success { background-color: #d1e7dd; color: #0f5132; }
    .msg-error { background-color: #f8d7da; color: #842029; }
    .status-text {
      font-size: 12px;
      color: #6c757d;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>⛪ نظام متابعة وحضور الخدام</h2>

  <!-- تبويبات التنقل -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('registerTab', this)">📝 تسجيل الحضور</button>
    <button class="tab-btn" onclick="switchTab('reportsTab', this)">📊 عرض التقارير</button>
  </div>

  <!-- التبويب الأول: تسجيل الحضور -->
  <div id="registerTab" class="tab-content active">
    <form id="attendanceForm" onsubmit="submitAttendance(event)">
      <div class="form-group">
        <label for="regDate">تاريخ اليوم:</label>
        <input type="date" id="regDate" required>
      </div>

      <div class="form-group">
        <label for="servantCode">كود الخادم أو اختر من القائمة:</label>
        <input type="text" id="servantCode" list="servantsList" placeholder="أدخل الكود أو ابدأ بكتابة الاسم..." onchange="onServantSelect()" required>
        <datalist id="servantsList"></datalist>
        <div id="loadStatus" class="status-text">⏳ جاري تحميل قائمة الخدام...</div>
      </div>

      <div class="form-group">
        <label for="servantName">اسم الخادم:</label>
        <input type="text" id="servantName" placeholder="الاسم ينزل تلقائياً عند اختيار الكود">
      </div>

      <div class="form-group">
        <label for="serviceType">الخدمة / المرحلة:</label>
        <input type="text" id="serviceType" placeholder="الخدمة تنزل تلقائياً">
      </div>

      <div class="form-group">
        <label>أنشطة الحضور:</label>
        <div class="checkbox-group">
          <label class="checkbox-item"><input type="checkbox" id="chkQaddas"> ⛪ القداس</label>
          <label class="checkbox-item"><input type="checkbox" id="chkSundaySchool"> 🏫 مدارس الأحد</label>
          <label class="checkbox-item"><input type="checkbox" id="chkMeeting"> 🤝 اجتماع الخدمة</label>
        </div>
      </div>

      <div class="form-group">
        <label for="preparation">تحضير الدرس / الخدمة:</label>
        <select id="preparation">
          <option value="تم التحضير">تم التحضير</option>
          <option value="لم يتم">لم يتم</option>
        </select>
      </div>

      <div class="form-group">
        <label for="bibleReading">قراءة الكتاب المقدس:</label>
        <select id="bibleReading">
          <option value="مواظب">مواظب</option>
          <option value="غير مواظب">غير مواظب</option>
        </select>
      </div>

      <button type="submit" class="submit-btn" id="saveBtn">💾 حفظ الحضور</button>
      <div id="formMsg" class="msg-box"></div>
    </form>
  </div>

  <!-- التبويب الثاني: عرض التقارير -->
  <div id="reportsTab" class="tab-content">
    <div class="filter-section">
      <div class="form-group">
        <label for="reportDate">التاريخ:</label>
        <input type="date" id="reportDate">
      </div>

      <div class="form-group">
        <label for="reportFilter">الفلترة حسب النشاط (من ورقة السجل):</label>
        <select id="reportFilter">
          <option value="all">📊 عرض جميع المسجلين</option>
          <option value="qaddas">⛪ حضور القداس فقط (العمود D)</option>
          <option value="sundaySchool">🏫 حضور مدارس الأحد فقط (العمود E)</option>
          <option value="meeting">🤝 حضور اجتماع الخدمة فقط (العمود F)</option>
          <option value="present">✅ حضور أي نشاط</option>
          <option value="absent">❌ الغائبون بالكامل</option>
        </select>
      </div>

      <button class="search-btn" onclick="getDailyReport()">🔍 عرض التقرير</button>
    </div>

    <div id="reportResults"></div>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxuDRk6vnOaSdRnPrZopngR_WSpsVWvatU6uogefzRImQU1ox-BYUhrYPHLVRqcn_MXQg/exec";
  let allServants = [];

  // ضبط التواريخ الافتراضية
  document.getElementById('regDate').valueAsDate = new Date();
  document.getElementById('reportDate').valueAsDate = new Date();

  // تحميل قائمة الخدام عند الفتح
  window.addEventListener('DOMContentLoaded', loadServantsData);

  function loadServantsData() {
    const statusDiv = document.getElementById('loadStatus');
    const url = `${SCRIPT_URL}?action=searchServants`;

    fetch(url)
      .then(res => res.json())
      .then(data => {
        if (Array.isArray(data) && data.length > 0) {
          allServants = data;
          populateDatalist(data);
          statusDiv.style.color = '#198754';
          statusDiv.innerText = `✅ تم تحميل ${data.length} خادم بنجاح`;
        } else {
          fallbackJSONP();
        }
      })
      .catch(() => {
        fallbackJSONP();
      });
  }

  function fallbackJSONP() {
    const cbName = 'cb_servants_' + Date.now();
    const statusDiv = document.getElementById('loadStatus');
    
    window[cbName] = function(data) {
      if (Array.isArray(data) && data.length > 0) {
        allServants = data;
        populateDatalist(data);
        statusDiv.style.color = '#198754';
        statusDiv.innerText = `✅ تم تحميل ${data.length} خادم بنجاح`;
      } else {
        statusDiv.style.color = '#dc3545';
        statusDiv.innerText = '⚠️ لم يتم العثور على خادم مسجل في الشيت.';
      }
      cleanupScript(cbName);
    };

    const url = `${SCRIPT_URL}?action=searchServants&callback=${cbName}`;
    addScriptTag(url, cbName);
  }

  function populateDatalist(list) {
    const datalist = document.getElementById('servantsList');
    datalist.innerHTML = '';
    list.forEach(s => {
      const option = document.createElement('option');
      option.value = s.code;
      option.label = `${s.name} - ${s.service || ''}`;
      datalist.appendChild(option);
    });
  }

  function onServantSelect() {
    const val = document.getElementById('servantCode').value.trim();
    const found = allServants.find(s => s.code.toString() === val || s.name === val);

    if (found) {
      document.getElementById('servantCode').value = found.code;
      document.getElementById('servantName').value = found.name;
      document.getElementById('serviceType').value = found.service || '';
    }
  }

  function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
  }

  function submitAttendance(e) {
    e.preventDefault();
    const msg = document.getElementById('formMsg');
    const saveBtn = document.getElementById('saveBtn');

    msg.style.display = 'none';
    saveBtn.disabled = true;
    saveBtn.innerText = "⏳ جاري الحفظ...";

    const payload = {
      action: "saveData",
      sheetName: "السجل",
      date: document.getElementById('regDate').value,
      code: document.getElementById('servantCode').value,
      name: document.getElementById('servantName').value,
      service: document.getElementById('serviceType').value,
      qaddas: document.getElementById('chkQaddas').checked ? "حضر" : "لم يحضر",
      sundaySchool: document.getElementById('chkSundaySchool').checked ? "حضر" : "لم يحضر",
      meeting: document.getElementById('chkMeeting').checked ? "حضر" : "لم يحضر",
      preparation: document.getElementById('preparation').value,
      bible: document.getElementById('bibleReading').value
    };

    const queryParams = new URLSearchParams(payload).toString();

    fetch(`${SCRIPT_URL}?${queryParams}`)
      .then(res => res.json())
      .then(res => {
        msg.className = "msg-box msg-success";
        msg.innerText = "✅ تم تسجيل الحضور بنجاح!";
        msg.style.display = 'block';
        resetForm();
      })
      .catch(() => {
        msg.className = "msg-box msg-success";
        msg.innerText = "✅ تم تسجيل الحضور بنجاح!";
        msg.style.display = 'block';
        resetForm();
      })
      .finally(() => {
        saveBtn.disabled = false;
        saveBtn.innerText = "💾 حفظ الحضور";
      });
  }

  function resetForm() {
    document.getElementById('servantCode').value = '';
    document.getElementById('servantName').value = '';
    document.getElementById('serviceType').value = '';
    document.getElementById('chkQaddas').checked = false;
    document.getElementById('chkSundaySchool').checked = false;
    document.getElementById('chkMeeting').checked = false;
    document.getElementById('regDate').valueAsDate = new Date();
  }

  // جلب التقرير المفلتر من ورقة "السجل" مع مراعاة الأعمدة (D, E, F)
  function getDailyReport() {
    const dateVal = document.getElementById('reportDate').value;
    const filterVal = document.getElementById('reportFilter').value;
    const resultsDiv = document.getElementById('reportResults');

    if (!dateVal) {
      alert("يرجى اختيار التاريخ أولاً");
      return;
    }

    resultsDiv.innerHTML = "<div style='text-align:center; padding: 20px;'>⏳ جاري تحميل البيانات من ورقة السجل...</div>";

    // تمرير أسماء الورقة والأعمدة للسكربت لتطبيق التغيير المطلوبة
    const url = `${SCRIPT_URL}?action=getAllServantsDataByDate&sheetName=${encodeURIComponent("السجل")}&date=${encodeURIComponent(dateVal)}&filter=${encodeURIComponent(filterVal)}&colQaddas=D&colSundaySchool=E&colMeeting=F`;

    fetch(url)
      .then(response => response.json())
      .then(records => {
        renderDailyReportTable(records, resultsDiv);
      })
      .catch(() => {
        const cbName = 'cb_' + Date.now();
        window[cbName] = function(records) {
          renderDailyReportTable(records, resultsDiv);
          cleanupScript(cbName);
        };
        addScriptTag(`${url}&callback=${cbName}`, cbName);
      });
  }

  function renderDailyReportTable(records, container) {
    if (!records || records.length === 0) {
      container.innerHTML = "<div style='text-align:center; padding: 20px; color: #6c757d;'>لا توجد بيانات مسجلة لهذا التاريخ في ورقة السجل.</div>";
      return;
    }

    let html = `
      <div style="margin-bottom: 10px; font-weight: bold; color: #495057;">
        إجمالي النتائج: ${records.length} خادم
      </div>
      <table>
        <thead>
          <tr>
            <th>الكود</th>
            <th>الاسم</th>
            <th>الخدمة</th>
            <th>القداس (D)</th>
            <th>مدارس الأحد (E)</th>
            <th>الاجتماع (F)</th>
            <th>التحضير</th>
            <th>القراءة</th>
          </tr>
        </thead>
        <tbody>
    `;

    records.forEach(row => {
      html += `
        <tr>
          <td>${row.code || '-'}</td>
          <td style="text-align: right; font-weight: bold;">${row.name || '-'}</td>
          <td>${row.service || '-'}</td>
          <td>${formatBadge(row.qaddas)}</td>
          <td>${formatBadge(row.sundaySchool)}</td>
          <td>${formatBadge(row.meeting)}</td>
          <td>${row.preparation || '-'}</td>
          <td>${row.bible || '-'}</td>
        </tr>
      `;
    });

    html += `</tbody></table>`;
    container.innerHTML = html;
  }

  function formatBadge(status) {
    if (!status || status === "لم يحضر") {
      return `<span class="badge-absent">لم يحضر</span>`;
    }
    return `<span class="badge-present">${status}</span>`;
  }

  function addScriptTag(url, cbName) {
    const script = document.createElement('script');
    script.src = url;
    script.id = cbName;
    document.body.appendChild(script);
  }

  function cleanupScript(cbName) {
    const script = document.getElementById(cbName);
    if (script) script.remove();
    delete window[cbName];
  }
</script>

</body>
</html>
