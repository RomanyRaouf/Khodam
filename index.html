<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام متابعة الخدمة والخدام</title>
    <style>
        :root {
            --primary-color: #1b365d;
            --secondary-color: #4a90e2;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
            --success-color: #2e7d32;
            --danger-color: #c62828;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            padding: 20px;
            background: var(--primary-color);
            color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            background-color: #fff;
            color: var(--primary-color);
        }

        .status-loading { background-color: #fff3cd; color: #856404; }
        .status-ready { background-color: #d4edda; color: #155724; }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 18px;
            color: var(--primary-color);
            margin-bottom: 15px;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 8px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"], input[type="date"], select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--secondary-color);
        }

        .btn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #357abd;
        }

        .btn-success { background-color: var(--success-color); }
        .btn-success:hover { background-color: #1e5622; }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        th {
            background-color: #f8f9fa;
            color: var(--primary-color);
            font-weight: bold;
        }

        tr:hover {
            background-color: #f1f5f9;
        }

        .refresh-btn {
            background: transparent;
            border: 1px solid white;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-right: 10px;
        }

        .refresh-btn:hover {
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>نظام متابعة الخدمة والخدام</h1>
        <div>
            <span id="loadStatus" class="status-badge status-loading">⏳ جاري تحميل القائمة...</span>
            <button class="refresh-btn" onclick="forceReloadServants()">🔄 تحديث القائمة</button>
        </div>
    </header>

    <!-- بطاقة البحث السريع وتصفية الخدام -->
    <div class="card">
        <h2>قائمة الخدام (<span id="servantsCount">0</span>)</h2>
        <div class="search-box">
            <input type="text" id="searchInput" oninput="filterServants()" placeholder="ابحث بالاسم أو الكود...">
        </div>
        
        <div class="table-responsive">
            <div id="allServantsTableArea">
                <p style="text-align: center; color: #777;">جاري تحضير البيانات...</p>
            </div>
        </div>
    </div>
</div>

<script>
    // رابط جوجل سكريبت الخادمي الخص بك
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby-pO3u_84xW_bXaeYQMh7CroDdXkZJTzbTf-GGm-fSnsgZx9d73HoCjI4GBqWsmdWnyA/exec";
    
    let allServantsList = [];

    // إضافة سكريبت JSONP ديناميكياً لتفادي مشاكل CORS
    function addScriptTag(url, callbackName) {
        const oldScript = document.getElementById(callbackName);
        if (oldScript) oldScript.remove();

        const script = document.createElement('script');
        script.id = callbackName;
        script.src = url;
        script.onerror = function() {
            const statusBadge = document.getElementById('loadStatus');
            statusBadge.innerText = "❌ خطأ في الاتصال";
            statusBadge.className = "status-badge";
            statusBadge.style.backgroundColor = "#f8d7da";
            statusBadge.style.color = "#721c24";
        };
        document.body.appendChild(script);
    }

    function cleanupScript(callbackName) {
        const script = document.getElementById(callbackName);
        if (script) script.remove();
        delete window[callbackName];
    }

    // تحميل قائمة الخدام عند فتح الصفحة بشكل فوري وعالي السرعة
    function loadAllServantsOnStart(forceRefresh = false) {
        const statusBadge = document.getElementById('loadStatus');

        // 1. القراءة الفورية من ذاكرة المتصفح المحلية إن وجدت
        const cachedData = localStorage.getItem('cached_servants_list');
        if (cachedData && !forceRefresh) {
            try {
                allServantsList = JSON.parse(cachedData);
                document.getElementById('servantsCount').innerText = allServantsList.length;
                statusBadge.innerText = `✅ جاهز (${allServantsList.length} خادم) [مخزن]`;
                statusBadge.className = "status-badge status-ready";
                renderAllServantsTable(allServantsList);
            } catch(e) {
                console.error("خطأ في التخزين المحلي", e);
            }
        }

        // 2. الطلب من السيرفر للتحديث في الخلفية
        const cbName = 'cb_load_servants_' + Date.now();
        window[cbName] = function(data) {
            if (data && Array.isArray(data) && data.length > 0) {
                allServantsList = data;
                // تحديث الذاكرة المحلية
                localStorage.setItem('cached_servants_list', JSON.stringify(data));
                
                document.getElementById('servantsCount').innerText = allServantsList.length;
                statusBadge.innerText = `✅ جاهز (${allServantsList.length} خادم)`;
                statusBadge.className = "status-badge status-ready";
                renderAllServantsTable(allServantsList);
            } else if (!cachedData) {
                statusBadge.innerText = "❌ تعذر التحميل";
                document.getElementById('allServantsTableArea').innerHTML = "<p style='color:red; text-align:center;'>فشل جلب قائمة الخدام من الشيت.</p>";
            }
            cleanupScript(cbName);
        };

        const url = `${SCRIPT_URL}?action=searchServants&callback=${cbName}`;
        addScriptTag(url, cbName);
    }

    // إجبار إعادة تحديث القائمة من السيرفر
    function forceReloadServants() {
        const statusBadge = document.getElementById('loadStatus');
        statusBadge.innerText = "⏳ جاري التحديث...";
        statusBadge.className = "status-badge status-loading";
        loadAllServantsOnStart(true);
    }

    // عرض القائمة في الجدول
    function renderAllServantsTable(list) {
        if (!list || list.length === 0) {
            document.getElementById('allServantsTableArea').innerHTML = "<p style='text-align:center;'>لا توجد بيانات للعرض.</p>";
            return;
        }

        let html = `
            <table>
                <thead>
                    <tr>
                        <th>الكود</th>
                        <th>الاسم</th>
                        <th>الخدمة</th>
                    </tr>
                </thead>
                <tbody>
        `;

        list.forEach(item => {
            html += `
                <tr>
                    <td><strong>${item.code || '-'}</strong></td>
                    <td>${item.name || '-'}</td>
                    <td>${item.service || '-'}</td>
                </tr>
            `;
        });

        html += `</tbody></table>`;
        document.getElementById('allServantsTableArea').innerHTML = html;
    }

    // البحث والتصفية أثناء الكتابة
    function filterServants() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        if (!query) {
            renderAllServantsTable(allServantsList);
            return;
        }

        const filtered = allServantsList.filter(s => 
            (s.name && s.name.toLowerCase().includes(query)) || 
            (s.code && s.code.toString().toLowerCase().includes(query)) ||
            (s.service && s.service.toLowerCase().includes(query))
        );

        renderAllServantsTable(filtered);
    }

    // بدء التشغيل تلقائياً فور تحميل الصفحة
    window.onload = function() {
        loadAllServantsOnStart();
    };
</script>

</body>
</html>
