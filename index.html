<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام متابعة وحضور الخدام</title>
  <style>
    body { background-color: #f4f6f9; margin: 0; padding: 20px; font-family: Tahoma; }
    .container { max-width: 900px; margin: auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
    .tabs { display: flex; border-bottom: 2px solid #dee2e6; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 12px; text-align: center; background: #f8f9fa; border: none; cursor: pointer; font-size: 16px; font-weight: bold; color: #6c757d; }
    .tab-btn.active { background: #0d6efd; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input, select, button { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ced4da; }
    .checkbox-group { display: flex; gap: 15px; flex-wrap: wrap; background: #f8f9fa; padding: 12px; border-radius: 6px; }
    .submit-btn { background-color: #198754; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 10px; height: 45px; font-size: 16px; }
    .submit-btn:hover { background-color: #157347; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #dee2e6; padding: 10px; text-align: center; font-size: 13px; }
    th { background-color: #0d6efd; color: white; }
    tr:nth-child(even) { background-color: #f8f9fa; }
    .msg-box { padding: 12px; border-radius: 6px; margin-top: 15px; text-align: center; font-weight: bold; display: none; }
    .msg-success { background-color: #d1e7dd; color: #0f5132; }
    .msg-error { background-color: #f8d7da; color: #842029; }
  </style>
</head>
<body>
<div class="container">
  <h2>⛪ نظام متابعة وحضور الخدام</h2>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('registerTab', this)">📝 تسجيل الحضور</button>
    <button class="tab-btn" onclick="switchTab('reportsTab', this)">📊 عرض التقارير</button>
  </div>

  <div id="registerTab" class="tab-content active">
    <form id="attendanceForm" onsubmit="submitAttendance(event)">
      <div class="form-group">
        <label for="regDate">تاريخ اليوم:</label>
        <input type="date" id="regDate" required>
      </div>

      <div class="form-group">
        <label for="servantCode">كود الخادم أو الاسم:</label>
        <input type="text" id="servantCode" list="servantsList" onchange="onServantSelect()" required>
        <datalist id="servantsList"></datalist>
      </div>

      <div class="form-group">
        <label for="servantName">اسم الخادم:</label>
        <input type="text" id="servantName" readonly>
      </div>

      <div class="form-group">
        <label for="serviceType">الخدمة / المرحلة:</label>
        <input type="text" id="serviceType" readonly>
      </div>

      <div class="form-group">
        <label>أنشطة الحضور:</label>
        <div class="checkbox-group">
          <label><input type="checkbox" id="chkQaddas"> ⛪ القداس</label>
          <label><input type="checkbox" id="chkSundaySchool"> 🏫 مدارس الأحد</label>
          <label><input type="checkbox" id="chkMeeting"> 🤝 اجتماع الخدمة</label>
        </div>
      </div>

      <div class="form-group">
        <label for="preparation">تحضير الدرس:</label>
        <select id="preparation">
          <option value="تم التحضير">تم التحضير</option>
          <option value="لم يتم">لم يتم</option>
        </select>
      </div>

      <div class="form-group">
        <label>قراءة الكتاب المقدس:</label>
        <div class="checkbox-group" id="bibleReadingGroup">
          <label><input type="checkbox" value="عهد قديم"> 📖 عهد قديم</label>
          <label><input type="checkbox" value="عهد جديد"> 📖 عهد جديد</label>
          <label><input type="checkbox" value="غير منتظم"> 📖 غير منتظم</label>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="saveBtn">💾 حفظ الحضور</button>
     <button type="button" class="submit-btn" onclick="finishRegistration()">✅ إنهاء التسجيل</button>

      <div id="formMsg" class="msg-box"></div>
    </form>
  </div>
  <div id="reportsTab" class="tab-content">
    <div class="form-group">
      <label for="reportDate">اختر التاريخ:</label>
      <input type="date" id="reportDate">
    </div>
    <button class="submit-btn" onclick="getDailyReport()">🔍 عرض التقرير</button>
    <div id="reportResults"></div>
  </div>
</div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyQ0lvSgPrcvqwzU1orykG9JiZfPh4o6VQlI5paZtm8eaQoJKGL7vTpv7fN1GQ_85VRXw/exec";
let allServants = [];

window.addEventListener('DOMContentLoaded', () => {
  if (document.getElementById('regDate')) document.getElementById('regDate').valueAsDate = new Date();
  if (document.getElementById('reportDate')) document.getElementById('reportDate').valueAsDate = new Date();
  loadServantsData();
});

function loadServantsData() {
  fetch(`${SCRIPT_URL}?action=searchServants`)
    .then(res => res.json())
    .then(data => {
      if (Array.isArray(data)) {
        allServants = data;
        populateDatalist(data);
      }
    });
}

function populateDatalist(list) {
  const datalist = document.getElementById('servantsList');
  datalist.innerHTML = '';
  list.forEach(s => {
    const option = document.createElement('option');
    option.value = s.code;
    option.label = `${s.name} - ${s.service || ''}`;
    datalist.appendChild(option);
  });
}

function onServantSelect() {
  const val = document.getElementById('servantCode').value.trim();
  const found = allServants.find(s => s.code.toString() === val || s.name.includes(val));
  if (found) {
    document.getElementById('servantCode').value = found.code;
    document.getElementById('servantName').value = found.name;
    document.getElementById('serviceType').value = found.service || '';
  }
}
function switchTab(tabId, btn) {
  // إخفاء كل التبويبات
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  // إزالة التفعيل من كل الأزرار
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  // تفعيل التبويب المطلوب
  document.getElementById(tabId).classList.add('active');
  btn.classList.add('active');
}
function submitAttendance(e) {
  e.preventDefault();
  const msg = document.getElementById('formMsg');
  const saveBtn = document.getElementById('saveBtn');
  msg.style.display = 'none';
  saveBtn.disabled = true;
  saveBtn.innerText = "⏳ جاري الحفظ...";

  // التحقق من اختيارات الكتاب المقدس
  const bibleSelected = document.querySelectorAll('#bibleReadingGroup input:checked');
  if (bibleSelected.length > 2) {
    alert("مسموح تختار اختيارين فقط في الكتاب المقدس.");
    saveBtn.disabled = false;
    saveBtn.innerText = "💾 حفظ الحضور";
    return;
  }
  let bibleValues = [];
  bibleSelected.forEach(item => bibleValues.push(item.value));

  // تجهيز البيانات
  const payload = {
    action: "saveData",
    sheetName: "السجل",
    date: document.getElementById('regDate').value,
    code: document.getElementById('servantCode').value,
    name: document.getElementById('servantName').value,
    service: document.getElementById('serviceType').value,
    qaddas: document.getElementById('chkQaddas').checked ? "حضر" : "لم يحضر",
    sundaySchool: document.getElementById('chkSundaySchool').checked ? "حضر" : "لم يحضر",
    meeting: document.getElementById('chkMeeting').checked ? "حضر" : "لم يحضر",
    preparation: document.getElementById('preparation').value,
    bible: bibleValues.join(" + ") || "لم يحدد"
  };

  // إرسال البيانات للسكريبت
  fetch(`${SCRIPT_URL}?${new URLSearchParams(payload).toString()}`)
    .then(res => res.json())
    .then(res => {
      msg.className = "msg-box msg-success";
      msg.innerText = "✅ تم تسجيل الحضور بنجاح!";
      msg.style.display = 'block';
      resetForm();
    })
    .catch(() => {
      msg.className = "msg-box msg-error";
      msg.innerText = "❌ حصل خطأ أثناء التسجيل";
      msg.style.display = 'block';
    })
    .finally(() => {
      saveBtn.disabled = false;
      saveBtn.innerText = "💾 حفظ الحضور";
    });
}
function resetForm() {
  document.getElementById('servantCode').value = '';
  document.getElementById('servantName').value = '';
  document.getElementById('serviceType').value = '';
  document.getElementById('chkQaddas').checked = false;
  document.getElementById('chkSundaySchool').checked = false;
  document.getElementById('chkMeeting').checked = false;
  document.querySelectorAll('#bibleReadingGroup input').forEach(chk => chk.checked = false);
  if (document.getElementById('regDate')) {
    document.getElementById('regDate').valueAsDate = new Date();
  }
}

function finishRegistration() {
  const dateVal = document.getElementById('regDate').value;
  const msg = document.getElementById('formMsg');
  msg.style.display = 'none';

  if (!dateVal) {
    alert("❌ لازم تختار التاريخ الأول");
    return;
  }

  msg.className = "msg-box";
  msg.innerText = "⏳ جاري إنهاء التسجيل...";
  msg.style.display = 'block';

  fetch(`${SCRIPT_URL}?action=finishRegistration&sheetName=السجل&date=${encodeURIComponent(dateVal)}`)
    .then(res => res.json())
    .then(res => {
      if (res.status === "success") {
        msg.className = "msg-box msg-success";
        msg.innerText = "✅ تم إنهاء التسجيل وتسجيل الغياب للباقي";
      } else {
        msg.className = "msg-box msg-error";
        msg.innerText = "❌ حصل خطأ أثناء إنهاء التسجيل";
      }
    })
    .catch(() => {
      msg.className = "msg-box msg-error";
      msg.innerText = "❌ خطأ في الاتصال بالسكريبت";
    });
}


function getDailyReport() {
  const dateVal = document.getElementById('reportDate').value;
  const resultsDiv = document.getElementById('reportResults');
  if (!dateVal) {
    alert("يرجى اختيار التاريخ أولاً");
    return;
  }
  resultsDiv.innerHTML = "⏳ جاري تحميل البيانات...";
  fetch(`${SCRIPT_URL}?action=getAllServantsDataByDate&sheetName=السجل&date=${encodeURIComponent(dateVal)}`)
    .then(res => res.json())
    .then(records => {
      if (!records || records.length === 0) {
        resultsDiv.innerHTML = "❌ لا توجد بيانات لهذا التاريخ";
        return;
      }
      let html = "<table><thead><tr><th>الكود</th><th>الاسم</th><th>الخدمة</th><th>القداس</th><th>مدارس الأحد</th><th>الاجتماع</th><th>التحضير</th><th>القراءة</th></tr></thead><tbody>";
      records.forEach(r => {
        html += `<tr>
          <td>${r.code || '-'}</td>
          <td>${r.name || '-'}</td>
          <td>${r.service || '-'}</td>
          <td>${r.qaddas || '-'}</td>
          <td>${r.sundaySchool || '-'}</td>
          <td>${r.meeting || '-'}</td>
          <td>${r.preparation || '-'}</td>
          <td>${r.bible || '-'}</td>
        </tr>`;
      });
      html += "</tbody></table>";
      resultsDiv.innerHTML = html;
    })
    .catch(() => resultsDiv.innerHTML = "❌ خطأ في تحميل التقرير");
}
</script>
</body>
</html>
