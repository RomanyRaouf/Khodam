<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام متابعة وافتقاد الخدام</title>
  <style>
    :root {
      --primary-color: #5c1d24;
      --secondary-color: #8b263e;
      --gold-color: #d4af37;
      --bg-color: #fdfaf7;
      --card-bg: #ffffff;
      --text-color: #2c1810;
      --border-color: #e2d2c3;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
      direction: rtl;
      background-image: radial-gradient(#8b263e10 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 25px 30px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(92, 29, 36, 0.12);
      border: 1px solid var(--border-color);
    }

    h2 {
      text-align: center;
      color: var(--primary-color);
      margin-bottom: 25px;
      font-size: 24px;
      border-bottom: 2px solid var(--gold-color);
      padding-bottom: 12px;
    }

    .tabs {
      display: flex;
      border-bottom: 2px solid var(--border-color);
      margin-bottom: 25px;
      gap: 5px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      text-align: center;
      background: #f8f4f0;
      border: 1px solid var(--border-color);
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      font-size: 15px;
      font-weight: bold;
      color: var(--primary-color);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab-btn:hover {
      background: #f0e6dd;
    }

    .tab-btn.active {
      background: var(--primary-color);
      color: #ffffff;
      border-color: var(--primary-color);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .form-group {
      margin-bottom: 18px;
      position: relative;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: var(--primary-color);
      font-size: 14px;
    }

    input[type="text"],
    input[type="date"],
    select {
      width: 100%;
      padding: 11px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
      background-color: #faf8f5;
      color: var(--text-color);
    }

    input[type="text"]:focus,
    input[type="date"]:focus,
    select:focus {
      outline: none;
      border-color: var(--gold-color);
      background-color: #fff;
    }

    .suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 0 0 8px 8px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }

    .suggestion-item {
      padding: 10px 15px;
      cursor: pointer;
      border-bottom: 1px solid #f4efe9;
      color: var(--text-color);
    }

    .suggestion-item:hover {
      background-color: #f8f1ea;
      color: var(--primary-color);
      font-weight: bold;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    @media (max-width: 600px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    .btn {
      width: 100%;
      padding: 13px;
      background-color: var(--primary-color);
      color: white;
      border: 1px solid var(--gold-color);
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
    }

    .btn:hover {
      background-color: var(--secondary-color);
    }

    .btn-print {
      background-color: #27ae60;
      border-color: #219150;
      margin-bottom: 15px;
    }

    .btn-print:hover {
      background-color: #219150;
    }

    .report-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      border-radius: 8px;
      overflow: hidden;
    }

    .report-table th, .report-table td {
      border: 1px solid var(--border-color);
      padding: 12px 10px;
      text-align: center;
      font-size: 14px;
    }

    .report-table th {
      background-color: var(--primary-color);
      color: white;
    }

    .report-table tr:nth-child(even) {
      background-color: #faf6f0;
    }

    @media print {
      body * {
        visibility: hidden;
      }
      #printArea, #printArea * {
        visibility: visible;
      }
      #printArea {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
      .btn, .tabs {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>⛪ نظام متابعة وافتقاد الخدام</h2>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('entryTab', this)">📝 تسجيل الحضور</button>
      <button class="tab-btn" onclick="switchTab('servantReportTab', this)">👤 سجل خادم</button>
      <button class="tab-btn" onclick="switchTab('dailyReportTab', this)">📊 تقرير يومي</button>
    </div>

    <!-- 1. تسجيل البيانات -->
    <div id="entryTab" class="tab-content active">
      <form id="attendanceForm" onsubmit="handleSaveData(event)">
        <div class="grid-2">
          <div class="form-group">
            <label>البحث / اكتب اسم الخادم أو الكود:</label>
            <input type="text" id="searchInput" placeholder="ابحث بأي جزء من الاسم..." oninput="filterServants(this.value)" autocomplete="off">
            <div id="suggestions" class="suggestions" style="display: none;"></div>
          </div>

          <div class="form-group">
            <label>كود الخادم:</label>
            <input type="text" id="servantCode" required readonly style="background: #eee5dc;">
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label>اسم الخادم:</label>
            <input type="text" id="servantName" required readonly style="background: #eee5dc;">
          </div>

          <div class="form-group">
            <label>التاريخ:</label>
            <input type="date" id="entryDate" required>
          </div>
        </div>

        <hr style="margin: 18px 0; border: 0; border-top: 1px dashed var(--border-color);">

        <div class="grid-2">
          <div class="form-group">
            <label>القداس:</label>
            <select id="qaddas">
              <option value="حضر">حضر</option>
              <option value="لم يحضر">لم يحضر</option>
              <option value="يعتذر">يعتذر</option>
            </select>
          </div>

          <div class="form-group">
            <label>مدارس الأحد:</label>
            <select id="sundaySchool">
              <option value="حضر">حضر</option>
              <option value="لم يحضر">لم يحضر</option>
              <option value="يعتذر">يعتذر</option>
            </select>
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label>اجتماع الخدمة:</label>
            <select id="meeting">
              <option value="حضر">حضر</option>
              <option value="لم يحضر">لم يحضر</option>
              <option value="يعتذر">يعتذر</option>
            </select>
          </div>

          <div class="form-group">
            <label>تحضير الدرس:</label>
            <select id="preparation">
              <option value="تم">تم</option>
              <option value="لم يتم">لم يتم</option>
            </select>
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label>قراءة العهد القديم:</label>
            <select id="oldTestament">
              <option value="تمت القراءة">تمت القراءة</option>
              <option value="لم تتم القراءة">لم تتم القراءة</option>
            </select>
          </div>

          <div class="form-group">
            <label>قراءة العهد الجديد:</label>
            <select id="newTestament">
              <option value="تمت القراءة">تمت القراءة</option>
              <option value="لم تتم القراءة">لم تتم القراءة</option>
            </select>
          </div>
        </div>

        <button type="submit" id="btnSave" class="btn">💾 حفظ البيانات</button>
      </form>
    </div>

    <!-- 2. سجل خادم معين -->
    <div id="servantReportTab" class="tab-content">
      <div class="form-group">
        <label>ادخل كود الخادم لعرض السجل:</label>
        <input type="text" id="searchServantCodeInput" placeholder="مثال: 101">
      </div>
      <button onclick="getServantHistory()" class="btn">🔍 عرض سجل الخادم</button>
      
      <div id="servantHistoryResults" style="margin-top: 20px;"></div>
    </div>

    <!-- 3. تقرير يومي -->
    <div id="dailyReportTab" class="tab-content">
      <div class="form-group">
        <label>اختر التاريخ:</label>
        <input type="date" id="reportDate">
      </div>
      <button onclick="getDailyReport()" class="btn">📊 عرض التقرير</button>

      <div id="printArea">
        <button id="btnReportPrint" onclick="window.print()" class="btn btn-print" style="display: none; margin-top: 15px;">🖨️ طباعة التقرير</button>
        <div id="reportResults" style="margin-top: 15px;"></div>
      </div>
    </div>

  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz-UCUYMvCMMGblB5LUYxx6IXYsrp__lSxkqEQ42w-nrEh5W-YWeWNEs2ZMvtAf5OY/exec";

    let allServantsList = [];

    document.addEventListener("DOMContentLoaded", function() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('entryDate').value = today;
      document.getElementById('reportDate').value = today;

      loadAllServants();
    });

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    // جلب كل الخدام من الشيت
    function loadAllServants() {
      const cbName = 'cb_load_servants_' + Date.now();
      window[cbName] = function(data) {
        if (data && Array.isArray(data)) {
          allServantsList = data;
        }
        cleanupScript(cbName);
      };
      const url = `${SCRIPT_URL}?action=searchServants&query=&callback=${cbName}`;
      addScriptTag(url, cbName);
    }

    function cleanText(str) {
      if (!str) return '';
      return str.toString().toLowerCase().trim()
        .replace(/[أإآٱ]/g, 'ا')
        .replace(/ة/g, 'ه')
        .replace(/ى/g, 'ي')
        .replace(/[\u064B-\u0652]/g, '');
    }

    // البحث بالتزامن الحقيقي أثناء الكتابة
    function filterServants(query) {
      const suggBox = document.getElementById('suggestions');
      const cleanQ = cleanText(query);

      if (!cleanQ) {
        suggBox.style.display = 'none';
        return;
      }

      // إذا لم تكن القائمة محملة بعد، يجلب البيانات من السيرفر مباشرة
      if (allServantsList.length === 0) {
        fetchDirectSearch(query);
        return;
      }

      const filtered = allServantsList.filter(item => {
        return cleanText(item.name).includes(cleanQ) || cleanText(item.code).includes(cleanQ);
      });

      renderSuggestions(filtered);
    }

    function fetchDirectSearch(query) {
      const cbName = 'cb_direct_search_' + Date.now();
      window[cbName] = function(data) {
        if (data && Array.isArray(data)) {
          renderSuggestions(data);
        }
        cleanupScript(cbName);
      };
      const url = `${SCRIPT_URL}?action=searchServants&query=${encodeURIComponent(query)}&callback=${cbName}`;
      addScriptTag(url, cbName);
    }

    function renderSuggestions(list) {
      const suggBox = document.getElementById('suggestions');
      suggBox.innerHTML = '';

      if (list && list.length > 0) {
        list.forEach(item => {
          const div = document.createElement('div');
          div.className = 'suggestion-item';
          div.innerText = `${item.name} (${item.code})`;
          div.onclick = function() {
            document.getElementById('servantCode').value = item.code;
            document.getElementById('servantName').value = item.name;
            document.getElementById('searchInput').value = item.name;
            suggBox.style.display = 'none';
          };
          suggBox.appendChild(div);
        });
        suggBox.style.display = 'block';
      } else {
        suggBox.style.display = 'none';
      }
    }

    function handleSaveData(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSave');
      btn.disabled = true;
      btn.innerText = "⏳ جاري الحفظ...";

      const oldTest = document.getElementById('oldTestament').value;
      const newTest = document.getElementById('newTestament').value;
      const bibleCombined = `ع.ق: ${oldTest} | ع.ج: ${newTest}`;

      const params = new URLSearchParams({
        action: 'saveData',
        code: document.getElementById('servantCode').value,
        name: document.getElementById('servantName').value,
        date: document.getElementById('entryDate').value,
        qaddas: document.getElementById('qaddas').value,
        sundaySchool: document.getElementById('sundaySchool').value,
        meeting: document.getElementById('meeting').value,
        preparation: document.getElementById('preparation').value,
        bible: bibleCombined
      });

      const cbName = 'cb_save_' + Date.now();
      window[cbName] = function(res) {
        if (res && res.status === "success") {
          alert("✅ تم حفظ البيانات بنجاح!");
          document.getElementById('attendanceForm').reset();
          const today = new Date().toISOString().split('T')[0];
          document.getElementById('entryDate').value = today;
        } else {
          alert("❌ حدث خطأ أثناء الحفظ.");
        }
        btn.disabled = false;
        btn.innerText = "💾 حفظ البيانات";
        cleanupScript(cbName);
      };

      const url = `${SCRIPT_URL}?${params.toString()}&callback=${cbName}`;
      addScriptTag(url, cbName);
    }

    function getServantHistory() {
      const code = document.getElementById('searchServantCodeInput').value.trim();
      const resultsDiv = document.getElementById('servantHistoryResults');

      if (!code) {
        alert("يرجى أدخال كود الخادم");
        return;
      }

      resultsDiv.innerHTML = "⏳ جاري تحميل السجل...";

      const cbName = 'cb_servant_hist_' + Date.now();
      window[cbName] = function(records) {
        if (!records || records.length === 0) {
          resultsDiv.innerHTML = "<p style='text-align:center;'>لا توجد سجلات لهذا الخادم.</p>";
        } else {
          let html = `<table class="report-table">
            <thead>
              <tr>
                <th>التاريخ</th>
                <th>قداس</th>
                <th>مدارس أحد</th>
                <th>اجتماع</th>
                <th>تحضير</th>
                <th>الكتاب المقدس</th>
              </tr>
            </thead>
            <tbody>`;
          records.forEach(r => {
            html += `<tr>
              <td>${r.date}</td>
              <td>${r.qaddas}</td>
              <td>${r.sundaySchool}</td>
              <td>${r.meeting}</td>
              <td>${r.preparation}</td>
              <td>${r.bible}</td>
            </tr>`;
          });
          html += `</tbody></table>`;
          resultsDiv.innerHTML = html;
        }
        cleanupScript(cbName);
      };

      const url = `${SCRIPT_URL}?action=searchServantData&code=${encodeURIComponent(code)}&callback=${cbName}`;
      addScriptTag(url, cbName);
    }

    function getDailyReport() {
      const dateVal = document.getElementById('reportDate').value;
      const resultsDiv = document.getElementById('reportResults');
      const printBtn = document.getElementById('btnReportPrint');

      if (!dateVal) {
        alert("يرجى اختيار التاريخ أولاً");
        return;
      }

      resultsDiv.innerHTML = "⏳ جاري تحميل تقرير اليوم...";
      printBtn.style.display = 'none';

      const cbName = 'cb_daily_' + Date.now();

      window[cbName] = function(records) {
        if (!records || !Array.isArray(records) || records.length === 0) {
          resultsDiv.innerHTML = `<p style='text-align:center; color:#777;'>لا توجد سجلات مسجلة لتاريخ: <b>${dateVal}</b></p>`;
        } else {
          let html = `<h4 style="margin: 0 0 10px 0; color: var(--primary-color); text-align: center;">📊 تقرير افتقاد الخدام ليوم: ${dateVal}</h4>`;
          html += `<table class="report-table">
            <thead>
              <tr>
                <th>الخادم</th>
                <th>قداس</th>
                <th>مدارس أحد</th>
                <th>اجتماع</th>
                <th>تحضير</th>
                <th>الكتاب المقدس</th>
              </tr>
            </thead>
            <tbody>`;

          records.forEach(function(rec) {
            html += `<tr>
              <td><b>${rec.name || ''}</b><br><small>(${rec.code || ''})</small></td>
              <td>${rec.qaddas || '-'}</td>
              <td>${rec.sundaySchool || '-'}</td>
              <td>${rec.meeting || '-'}</td>
              <td>${rec.preparation || '-'}</td>
              <td>${rec.bible || '-'}</td>
            </tr>`;
          });

          html += `</tbody></table>`;
          resultsDiv.innerHTML = html;
          printBtn.style.display = 'block';
        }

        cleanupScript(cbName);
      };

      const url = `${SCRIPT_URL}?action=getAllServantsDataByDate&date=${encodeURIComponent(dateVal)}&callback=${cbName}`;
      addScriptTag(url, cbName);
    }

    function addScriptTag(url, id) {
      cleanupScript(id);
      const script = document.createElement('script');
      script.id = id;
      script.src = url;
      script.onerror = function() {
        console.error("خطأ في الاتصال بالرابط:", url);
      };
      document.body.appendChild(script);
    }

    function cleanupScript(id) {
      delete window[id];
      const elem = document.getElementById(id);
      if (elem) elem.remove();
    }
  </script>
</body>
</html>
